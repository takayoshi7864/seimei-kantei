<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>姓名鑑定</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1b2540">
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#23211d; --sub:#6b675f; --line:#dedad0;
  --good:#1f7a4d; --bad:#b3261e; --warn:#a86a00; --none:#7a766d; --accent:#2f4f7f;
  --good-bg:#e4f3ea; --bad-bg:#fbe7e5; --warn-bg:#fbf0d9; --none-bg:#eeece6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17181a; --panel:#202225; --ink:#ecebe6; --sub:#a5a299; --line:#34363a;
    --good:#66c796; --bad:#ff8a80; --warn:#f0b758; --none:#9a978e; --accent:#8fb1e8;
    --good-bg:#18332a; --bad-bg:#3a1f1d; --warn-bg:#3a2f16; --none-bg:#2a2b2e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17181a; --panel:#202225; --ink:#ecebe6; --sub:#a5a299; --line:#34363a;
    --good:#66c796; --bad:#ff8a80; --warn:#f0b758; --none:#9a978e; --accent:#8fb1e8;
    --good-bg:#18332a; --bad-bg:#3a1f1d; --warn-bg:#3a2f16; --none-bg:#2a2b2e;
  color-scheme:dark;
}
:root[data-theme="light"]{ color-scheme:light; }
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.theme{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.theme button{background:var(--panel);color:var(--sub);border:0;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.theme button+button{border-left:1px solid var(--line)}
.theme button.on{background:var(--accent);color:var(--bg);font-weight:700}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Hiragino Sans","Yu Gothic",system-ui,sans-serif}
header{padding:14px 16px 0;max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0 0 8px;letter-spacing:.05em}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);max-width:1100px;margin:0 auto;padding:0 16px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--sub);padding:10px 14px;font:inherit;cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px;color:var(--accent)}
h3{font-size:14px;margin:14px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--sub);gap:3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
input:not([type=checkbox]),select{height:40px;font-size:16px}
input.kanji{width:12em}
input.num{width:5em}
button.primary{background:var(--accent);color:#fff;border:0;border-radius:6px;height:40px;padding:0 22px;font:inherit;font-size:16px;cursor:pointer}
button.reset{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;height:40px;padding:0 22px;font:inherit;font-size:16px;cursor:pointer}
button.small{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap}
@media(max-width:700px){
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:6px 10px}
  td,th{border:0;padding:3px 0}
  td{display:flex;gap:10px;align-items:baseline;word-break:break-word}
  td::before{content:attr(data-label);flex:0 0 4.5em;color:var(--sub);font-size:12px}
  td:empty{display:none}
  td.ch{font-size:28px;line-height:1.2}
  td input.num,td select{max-width:100%}
}
td.ch{font-size:26px;line-height:1.2;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.verdict{border-radius:12px;padding:16px 20px;margin-bottom:14px;border:2px solid;display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap}
.verdict.good{background:var(--good-bg);border-color:var(--good)}
.verdict.bad{background:var(--bad-bg);border-color:var(--bad)}
.verdict .big{font-size:48px;font-weight:800;letter-spacing:.12em;line-height:1.1}
.verdict.good .big{color:var(--good)}
.verdict.bad .big{color:var(--bad)}
.verdict .lbl{font-size:12px;color:var(--sub)}
.verdict .why{flex:1;min-width:220px;font-size:14px;line-height:1.7}
@media(max-width:700px){.verdict{padding:14px 16px}.verdict .big{font-size:40px}}
.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}
.good{color:var(--good);background:var(--good-bg)}
.bad{color:var(--bad);background:var(--bad-bg)}
.warn{color:var(--warn);background:var(--warn-bg)}
.none{color:var(--none);background:var(--none-bg)}
.sub{color:var(--sub);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:4px}
.card .ttl{font-weight:700}
ul.pl{margin:4px 0;padding-left:1.2em}
.bar{display:flex;height:22px;border-radius:5px;overflow:hidden;border:1px solid var(--line);margin:6px 0}
.bar div{display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
@media(max-width:700px){.bar .bn{display:none}}
.yy{font-size:20px;letter-spacing:.2em}
.hidden{display:none}
.err{display:block;color:var(--bad);font-size:13px;line-height:20px;height:20px;margin-top:2px;white-space:nowrap}
.row.top{align-items:flex-start;padding-bottom:22px}   /* 2行目の下にも、1行目のエラー行と同じだけの余白を空けておく */
.row.top>button{align-self:flex-end}
details{margin:6px 0}
summary{cursor:pointer;color:var(--accent)}
pre.cfg{width:100%;min-height:150px;font:12px/1.5 ui-monospace,Menlo,monospace}
.mono{font-family:ui-monospace,Menlo,monospace}
@media (max-width:640px){ main{padding:10px} input.kanji{width:100%} }
</style>
</head>
<body>
<header><h1>姓名鑑定</h1><div class="theme" id="theme"><button data-m="auto">自動</button><button data-m="light">ライト</button><button data-m="dark">ダーク</button></div></header>
<nav id="tabs">
  <button data-t="kantei" class="on">鑑定</button>
  <button data-t="search">字典検索</button>
  <button data-t="kaku">画数の深義</button>
</nav>
<main>

<!-- ===== 鑑定 ===== -->
<div id="t-kantei">
<section class="panel">
  <h2>入力</h2>
  <div class="row top">
    <label>姓名（姓と名をスペースで区切る）<input id="full" class="kanji" value="" placeholder="例 佐藤 太郎" autocomplete="off"></label>
    <label>読み（姓と名をスペースで区切る・任意）<input id="yomi" value="" placeholder="例 さとう たろう" autocomplete="off"><span id="yomi-err" class="err" role="alert"></span></label>
    <label>生年月日（任意）<input id="birth" class="num" style="width:180px" inputmode="numeric" placeholder="例 1985/7/13" autocomplete="off"></label>
    <label>出生時刻（任意）<input id="birthT" type="time"></label>
    <label>性別（任意）
      <select id="sex"><option value="">指定なし</option><option value="m">男性</option><option value="f">女性</option></select>
    </label>
    <label>続柄（任意）<input id="zoku" value="" placeholder="例 長男" autocomplete="off"></label>
    <label>本命星（任意）
      <select id="honmei"><option value="">指定なし</option><option>一白水星</option><option>二黒土星</option><option>三碧木星</option><option>四緑木星</option><option>五黄土星</option><option>六白金星</option><option>七赤金星</option><option>八白土星</option><option>九紫火星</option></select>
    </label>
    <button class="primary" id="go">鑑定する</button>
    <button class="reset" id="reset" type="button">リセット</button>
  </div>
</section>
<div id="result"></div>
</div>

<!-- ===== 字典検索 ===== -->
<div id="t-search" class="hidden">
<section class="panel">
  <h2>字典検索</h2>
  <div class="row">
    <label>検索語（漢字・読み・名乗り）<input id="q" class="kanji" placeholder="例 崎 / たか / ひろ" autocomplete="off"></label>
    <label>画数<input id="qn" class="num" type="number" min="1" max="30" placeholder="全て"></label>
    <label>五行
      <select id="qg"><option value="">全て</option><option>木</option><option>火</option><option>土</option><option>金</option><option>水</option></select>
    </label>
  </div>
  <p class="sub" id="qinfo"></p>
  <div id="qres"></div>
</section>
</div>

<!-- ===== 画数の深義 ===== -->
<div id="t-kaku" class="hidden">
<section class="panel">
  <h2>画数の深義（1〜81画）</h2>
  <div class="row"><label>画数で絞る<input id="kn" class="num" type="number" min="1" max="81" placeholder="全て"></label>
  <label>区分<select id="kg"><option value="">全て</option><option>大吉</option><option>吉</option><option>中</option><option>凶</option><option>大凶</option></select></label></div>
  <div id="kres"></div>
</section>
</div>

<!-- ===== 設定 ===== -->
</main>

const DEFAULT_KAKU = {};                // 利用者が区分を上書きするための表（初期は空）
const STRONG_NUMS = [31,33,39,41];      // 強い吉数（レポート：ダークサイド効果の対象）
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let KAKU = DEFAULT_KAKU;

/* ================= 辞典の索引 ================= */
const BYCHAR = new Map();
for(const e of DICT){
  for(const ch of new Set([e.c, e.k].filter(Boolean))){
    if(!BYCHAR.has(ch)) BYCHAR.set(ch, []);
    BYCHAR.get(ch).push(e);

}
const kata2hira = s => s.replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60));

        const seg = R.slice(p,p+L);
        if(seg.length===L && (seg===piece || devoice(seg)===devoice(piece))){ if(dfs(i+1,p+L)){ok=true;break;} }
      }
      if(ok) break;
    }
    memo.set(key,ok); return ok;
  }

}

function compute(seiStr, meiStr, ov){
  const sei = lookupChars(seiStr), mei = lookupChars(meiStr);
  const all = [...sei, ...mei];
  all.forEach((c,i)=>{ c.idx=i; c.part = i<sei.length?'sei':'mei'; });
  const strokes = all.map(c=>{
    if(ov && ov.n && ov.n[c.idx]!=null && ov.n[c.idx]!=='') return Number(ov.n[c.idx]);
    if(ov && ov.sel && ov.sel[c.idx]!=null) c.sel = ov.sel[c.idx];
    const e = c.list[c.sel]; return e? e.n : null;
  });
  all.forEach((c,i)=>{ c.n=strokes[i]; c.entry=c.list[c.sel]||null; });
  return {sei, mei, all};
}
function parts(seiN, meiN){
  const sum = a=>a.reduce((x,y)=>x+y,0);
  const s0=seiN[0], sL=seiN[seiN.length-1], m0=meiN[0], mL=meiN[meiN.length-1];
  return {
    tenkaku: sum(seiN), jinkaku: sL+m0, chikaku: sum(meiN), soukaku: sum(seiN)+sum(meiN),
    tensuu: s0, chisuu: m0, teisuu: mL
  };
}

const SHIBARI_THEME={'里':['実家・家系・親戚の問題','実家や家系の力を、前向きな支えにできる'],'貝':['お金・経済の問題','お金や経済の面で、堅実に成果を積み重ねやすい'],'宀':['家・親・目上からの押さえつけ','家や目上との結びつきを、安定した土台にできる'],'人':['人間関係（身内・同僚・他人）の問題','人との結びつきが強まり、良い縁を繰り返し得やすい'],'口':['発言・言葉にまつわる苦労','良い言葉や教えを、繰り返し人に伝える力になる']};

function judgeMeaning(seiStr, meiStr, yomi, zoku, baseBad, sex){
  const items=[]; const hits=[];
  for(const [pat,pos,,note] of KYOSOU){
    if(pos==='any'){
      if(meiStr.includes(pat)) hits.push({where:'名',pat,note});
      else if(seiStr.includes(pat)) hits.push({where:'姓（参考）',pat,note,ref:true});
    }else if(pos==='name'){
      // 名全体がその名であるときだけ（読みが字の境目をまたいで一致しても当てない：例 啓祐＝たかよし に「かよ」）
      if(meiStr===pat || (yomi && yomi===pat)) hits.push({where:'名',pat,note});
    }else if(pos==='nameHead'){
      if((pat==='朝'||pat==='麻') && sex==='m') continue;
      if(meiStr.startsWith(pat) || (pat==='心' && ((yomi && yomi.startsWith('こころ')) || kata2hira(meiStr).startsWith('こころ')))) hits.push({where:'名',pat,note});
      else if(pat==='人' && meiStr.length===1 && meiStr==='人') hits.push({where:'名',pat,note});
    }
  }
  for(const h of hits) items.push({st:h.ref?'warn':'bad', t:`凶相文字「${h.pat}」（${h.where}）`, d:h.note});
  // 長男・次男の逆転
  if(zoku==='chou' && [...meiStr].some(c=>JI_CHARS.includes(c))) items.push({st:'bad',t:'長男に次男の字',d:'家督をめぐる紛争、能力を発揮できない、組織内の下克上を招く。'});
  if(zoku==='ji' && [...meiStr].some(c=>CHOU_CHARS.includes(c))) items.push({st:'bad',t:'次男に長男の字',d:'家督をめぐる紛争、能力を発揮できない、組織内の下克上を招く。'});
  if(baseBad!==null && baseBad!==undefined){
    for(const ch of new Set([...meiStr])){
      const d=DUAL[ch]; if(!d) continue;
      items.push(baseBad ? {st:'bad',t:`「${ch}」は薬が毒に転じます`,d:`${d[0]}他の真理に凶があるため、${d[2]}`}
                         : {st:'good',t:`「${ch}」は薬として働きます`,d:`${d[0]}他の真理に凶がないため、${d[1]}`});
    }
  }
  if(!items.length) items.push({st:'good',t:'凶相文字',d:'レポートに挙げられた凶相文字は見当たりません。'});
  return items;
}

const isKanaOnly = s => /^[ぁ-ゟァ-ヿー]+$/.test(s);
function judgeSound(yomi, meiChars, yomiSei, meiStr){
  const items=[];
  const kanaName = isKanaOnly(meiStr||'') ? kata2hira(meiStr) : '';     // 名をひらがなで表記している場合
  const reading = yomi || kanaName;
  if(!reading){ items.push({st:'none',t:'読み',d:'名の読みを入力すると、濁音・当て字の疑い・名頭の音を調べます。'}); return items; }

  const kanaPart = kata2hira([...(meiStr||'')].filter(c=>/[ぁ-ゖァ-ヺ]/.test(c)).join(''));
  if(DAKUON.test(kanaPart)) items.push({st:'bad',t:'ひらがな表記に濁音を含む',d:'人生に余分なものがついてくる。本来負う必要のない余分な苦労・トラブル・他人の債務や子供の面倒などが付き纏う。'});
  else if(yomi && DAKUON.test(yomi)) items.push({st:'good',t:'濁音',d:'読みに濁音がありますが、漢字表記なら問題ありません（ひらがな表記だと凶）。'});
  else items.push({st:'good',t:'濁音',d:'濁音は含まれません。'});
  if(kanaPart.slice(0,-1).includes('ん')) items.push({st:'warn',t:'名の途中に仮名の「ん」',d:'途中の「ん」は△。語尾の「ん」ほどは悪くないが、好ましくありません。'});

    if(rep_.length) items.push({st:'bad',t:'同一音の重複',d:`${rep_.join('、')}が同じ音です。姓と名にまたがって同じ音が反復する構造は、同じ苦労や失敗を繰り返す凶名とされます。`});
    else items.push({st:'good',t:'同一音の重複',d:'姓と名にまたがる同じ音の反復は見当たりません。'});
  }
  if(!kanaName){
    const al = alignReading(reading, meiChars);
    if(al===null) items.push({st:'none',t:'音と字の対応',d:'辞典に無い字があるため調べられません。'});

  }

}

function judgeGogyo(chars, seiLen){
  // 五行は字音（辞典の五行＝音読みの行）だけで判定する
  const items=[]; let st='good';
  const a = chars.map(c=>c.entry?c.entry.g:null);
  const line = `字音の五行：${a.map((g,i)=>chars[i].ch+(g||(chars[i].ch==='ん'?'（五行なし）':'？'))).join('　')}`;
  const hit=(cls)=>{ if(cls==='bad') st='bad'; else if(cls==='warn' && st!=='bad') st='warn'; };
  const BAD_PAIR=['火火','水水','火水','水火'];
  const x=a[seiLen-1], y=a[seiLen];
  if(x&&y){
    if(BAD_PAIR.includes(x+y)){ items.push({st:'bad',t:`人格接続部が${x}－${y}`,d:'人格接続部（姓の最後の字と名の最初の字）の火－火・水－水・火－水・水－火は、無条件で大凶。'}); hit('bad'); }
    else if(x+y==='火金'||x+y==='金火'){ items.push({st:'warn',t:`人格接続部が${x}－${y}（火克金）`,d:'火が金を攻める相克の配置です。火が金を溶かし、財産・家族の結束・身体基盤を損なうとされます。大凶とされる火火・水水・火水・水火には当たりません。'}); hit('warn'); }
    else items.push({st:'good',t:'人格接続部',d:`${x}－${y}で、火火・水水・火水・水火にも、火克金にも当たりません。`});
  }else if(x===''||y===''){ items.push({st:'none',t:'人格接続部',d:'人格接続部に五行のない字（ん・ー）があるため判定しません。'}); }
  else items.push({st:'none',t:'人格接続部',d:'辞典に無い字があるため判定できません。'});
  if(chars.length>=3 && a.every(Boolean)){
    const k=new Set(a).size;
    if(k===1){ items.push({st:'bad',t:'五行が1種類に集中',d:'極端な集中。その五行に対応する病気や性格の偏りを引き起こす。'}); hit('bad'); }
    else if(k===2){ items.push({st:'warn',t:'五行が2種類のみ',d:'五行は3種類以上が理想。2種類以下への偏りは、その五行に対応する病気や性格の偏りを引き起こす。'}); hit('warn'); }
    else items.push({st:'good',t:'五行の種類',d:k>=4?`${k}種類あり、非常に良い配置です。`:`${k}種類あり、理想の3種類以上です。`});
  }
  const pairs=[];
  if(x&&y) pairs.push({n:'人格（姓の最後の字と名の最初の字）',a:x,b:y});
  if(chars.length-seiLen>=2){ const m0=a[seiLen], m1=a[a.length-1]; if(m0&&m1) pairs.push({n:'地格（名の最初の字と最後の字）',a:m0,b:m1}); }
  return {st, items, line, pairs};
}

function inyouBlock(m){

  if(m.length===2) return {b:m, note:''};
  const r=[]; for(const x of m) if(!r.length||r[r.length-1]!==x) r.push(x);
  if(r.length===1) return {b:[r[0],r[0]], note:'同じ陰陽の連続を1つにまとめました。'};
  if(r.length===2) return {b:r, note:'同じ陰陽の連続を1つにまとめました。'};

}

  const SHO='足元（行動力）は強いが、深く考えずに動いて先々でトラブル・障害・摩擦を起こしやすい。';
  let dai=null, sho=null;
  const ratio = big/small;
  if(ratio>=1.8){
    const w = ratio>2 ? '2倍を超えています' : '約2倍です';
    if(P.tenkaku>P.chikaku) dai=`天格${P.tenkaku}画が地格${P.chikaku}画の${w}。`; else sho=`地格${P.chikaku}画が天格${P.tenkaku}画の${w}。`;
  }
  if(P.seiLen>=4 && P.meiLen===1){ dai=(dai?dai+'また、':'')+`${P.seiLen}文字の苗字に1文字の名前で、上が重すぎます（4文字苗字なら名前は最低2文字、できれば3文字）。`; }
  if(P.seiLen===1 && P.meiLen>=3){ sho=(sho?sho+'また、':'')+`1文字の苗字に${P.meiLen}文字の名前で、下が重すぎます。`; }

  for(let i=1;i<=8;i++){
    if(bad[i]) continue;

function kigakuNow(hon,getsu,date,age,eff){

  const okY=new Set([...Y.best,...Y.good]), both=[...M.best,...M.good].filter(i=>okY.has(i));

  return {Y:{best:st(yS)(Y.best),good:st(yS)(Y.good),c:yS},M:{best:st(mS)(M.best),good:st(mS)(M.good),c:mS},D:{best:st(dS)(D.best),good:st(dS)(D.good),c:dS},both:bothS,month:((2+o.k-1)%12)+1,doyo,shouni};

  document.querySelectorAll('[data-n]').forEach(el=>el.addEventListener('change',()=>{ STATE.ov.n[el.dataset.n]=el.value; render(); }));
  document.querySelectorAll('[data-sel]').forEach(el=>el.addEventListener('change',()=>{ STATE.ov.sel[el.dataset.sel]=Number(el.value); delete STATE.ov.n[el.dataset.sel]; render(); }));
  for(const k of ['tate','yoko','shibari']){ const el=document.getElementById('f-'+k); if(el) el.addEventListener('change',()=>{ STATE.flags[k]=el.checked; render(); }); }
  const y=document.getElementById('yomikudashi'); if(y) y.addEventListener('change',()=>{ STATE.yomikudashi=y.value; render(); });
}
/* 狭い画面では表を縦並びのカードにする：各セルに見出しを付ける */
function labelTables(root){
  root.querySelectorAll('table').forEach(t=>{
    const hs=[...t.querySelectorAll('thead th')].map(x=>x.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{ if(hs[i]) td.setAttribute('data-label',hs[i]); }));
  });

for(const id of ['result','qres','kres']){ const el=document.getElementById(id); if(el) new MutationObserver(()=>labelTables(el)).observe(el,{childList:true}); }
/* 読みの自動入力：漢字を日本語入力（IME）で打つとき、変換前のかな（読み）を覚えて、読みの欄に入れる */
const AUTOKANA = {pairs:{}, last:'', manual:false};
/* 調査用：URLの末尾に ?debug=1 を付けると、日本語入力のイベントの記録を画面の下に出す */
if(/[?&]debug=1/.test(location.search)){
  const pre=document.createElement('pre');
  pre.style.cssText='position:fixed;left:0;right:0;bottom:0;max-height:38vh;overflow:auto;margin:0;padding:8px;background:#000;color:#0f0;font:11px/1.4 monospace;z-index:99;white-space:pre-wrap';
  document.body.appendChild(pre);
  const log=m=>{ pre.textContent+=m+'\n'; pre.scrollTop=pre.scrollHeight; };
  log('UA: '+navigator.userAgent);
  const f=document.getElementById('full');
  for(const t of ['compositionstart','compositionupdate','compositionend','beforeinput','input'])
    f.addEventListener(t,e=>log(t+' data=「'+(e.data===null?'null':e.data)+'」 composing='+e.isComposing+(e.inputType?' type='+e.inputType:'')+' value=「'+f.value+'」 last=「'+AUTOKANA.last+'」 読み欄=「'+document.getElementById('yomi').value+'」'),true);
}

(function(){
  const full=document.getElementById('full'), yomi=document.getElementById('yomi');
  const isKana=t=>/^[ぁ-ゖァ-ヺー]+$/.test(t);
  // ライブ変換で、変換前のかなが画面から消える場合に備え、打ったキー（ローマ字）からも読みを作る
  const R2K=(()=>{ const t={}; const add=(k,v)=>{ t[k]=v; };
    const V={a:'あ',i:'い',u:'う',e:'え',o:'お'};
    for(const k in V) add(k,V[k]);
    const rows={k:'かきくけこ',s:'さしすせそ',t:'たちつてと',n:'なにぬねの',h:'はひふへほ',m:'まみむめも',y:'や*ゆ*よ',r:'らりるれろ',w:'わゐ*ゑを',g:'がぎぐげご',z:'ざじずぜぞ',d:'だぢづでど',b:'ばびぶべぼ',p:'ぱぴぷぺぽ'};
    for(const c in rows){ [...rows[c]].forEach((k,i)=>{ if(k!=='*') add(c+'aiueo'[i],k); }); }
    const small={ya:'ゃ',yu:'ゅ',yo:'ょ'}, yo={ya:'や',yu:'ゆ',yo:'よ'};
    for(const c of 'kgsztdnhbpmr'){ const base=t[c+'i']; for(const y in small) add(c+y,base+small[y]); }
    for(const [k,v] of Object.entries({shi:'し',sha:'しゃ',shu:'しゅ',sho:'しょ',she:'しぇ',chi:'ち',cha:'ちゃ',chu:'ちゅ',cho:'ちょ',che:'ちぇ',tsu:'つ',fu:'ふ',fa:'ふぁ',fi:'ふぃ',fe:'ふぇ',fo:'ふぉ',ji:'じ',ja:'じゃ',ju:'じゅ',jo:'じょ',je:'じぇ',jya:'じゃ',jyu:'じゅ',jyo:'じょ',zya:'じゃ',dya:'ぢゃ',tya:'ちゃ',tyu:'ちゅ',tyo:'ちょ',cya:'ちゃ',cyu:'ちゅ',cyo:'ちょ',thi:'てぃ',dhi:'でぃ',tha:'てゃ',thu:'てゅ',dhu:'でゅ',wi:'うぃ',we:'うぇ',wo:'を',va:'ゔぁ',vi:'ゔぃ',vu:'ゔ',ve:'ゔぇ',vo:'ゔぉ',qa:'くぁ',nn:'ん',xa:'ぁ',xi:'ぃ',xu:'ぅ',xe:'ぇ',xo:'ぉ',la:'ぁ',li:'ぃ',lu:'ぅ',le:'ぇ',lo:'ぉ',xya:'ゃ',xyu:'ゅ',xyo:'ょ',lya:'ゃ',lyu:'ゅ',lyo:'ょ',xtu:'っ',ltu:'っ',xtsu:'っ',ltsu:'っ'})) add(k,v);
    add('-','ー'); add(',','、'); add('.','。');
    return t; })();
  const romajiToKana=r=>{
    let out='', i=0;
    while(i<r.length){
      let hit=null;
      for(let L=4;L>=1&&!hit;L--){ const seg=r.substr(i,L); if(seg.length===L && R2K[seg]){ hit=[seg,R2K[seg]]; } }
      if(hit){ out+=hit[1]; i+=hit[0].length; continue; }
      const c=r[i], n=r[i+1];
      if(c==='n' && (n===undefined || !/[aiueoy]/.test(n))){ out+='ん'; i++; continue; }          // 「n」＋子音、語末の「n」は「ん」
      if(n && c===n && /[kstpgzdbcfhjmrwy]/.test(c)){ out+='っ'; i++; continue; }                  // 子音の重なりは「っ」
      out+=c; i++;                                                                                    // 変換できない文字はそのまま
    }
    return out; };
  // 日本語入力の「変換前のかな」を記録する（姓名欄・読み欄の両方で使う）
  const h2=x=>x.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  function makeCapture(el){
    const st={romaji:'', last:''};
    el.addEventListener('keydown',e=>{
      if(!(e.isComposing||e.keyCode===229)||e.ctrlKey||e.metaKey||e.altKey){ if(!e.isComposing && e.key && e.key.length===1) st.romaji=''; return; }
      const m=/^Key([A-Z])$/.exec(e.code||'');
      if(m) st.romaji+=m[1].toLowerCase();
      else if(e.code==='Minus') st.romaji+='-';
      else if(e.code==='Backspace') st.romaji=st.romaji.slice(0,-1);
    });
    // 最初のキーは compositionstart より前に keydown が来るので、romaji は終了時に消す
    el.addEventListener('compositionstart',()=>{ st.last=''; });
    el.addEventListener('compositionupdate',e=>{ if(isKana(e.data||'')) st.last=e.data; });
    st.finish=data=>{                                  // 確定した文字と、その読みを返す
      const t=data||''; let rd=st.last;
      const derived=romajiToKana(st.romaji);
      // ローマ字から作った読みが、画面で見えたかなと矛盾しなければ、そちら（欠けが無い方）を使う
      if(derived && isKana(derived) && (!rd || h2(derived).startsWith(h2(rd)))) rd = (rd && /^[ァ-ヺー]/.test(rd)) ? derived.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)) : derived;
      st.last=''; st.romaji='';
      return {t,rd};
    };
    return st;
  }
  const capFull=makeCapture(full), capYomi=makeCapture(yomi);
  full.addEventListener('compositionend',e=>{
    const {t,rd}=capFull.finish(e.data);
    if(t && rd && t!==rd) AUTOKANA.pairs[t]=rd;
    fill();
  });
  full.addEventListener('input',e=>{ if(!e.isComposing) fill(); });
  // 読みの欄は、ひらがなに固定する（カタカナ・半角カナは、ひらがなに直す）
  const toHira=v=>v.normalize('NFKC').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[^ぁ-ゖー ]/g,'');   // ひらがな・長音・空白以外（漢字など）は取り除く
  const errEl=document.getElementById('yomi-err'); let errTm=null;
  const showErr=m=>{ errEl.textContent=m; clearTimeout(errTm); errTm=setTimeout(()=>{ errEl.textContent=''; },4000); };
  const hiraFix=()=>{ const v=yomi.value, h=toHira(v); if(h!==v){
      const p=yomi.selectionStart, same=h.length===v.length; yomi.value=h; try{ const q=same?p:h.length; yomi.setSelectionRange(q,q); }catch(e){}
      // 全角・半角のカナを直しただけならエラーにしない。漢字・英数字などを取り除いたときだけ知らせる
      const keep=x=>x.normalize('NFKC').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
      if(keep(v).replace(/[^ぁ-ゖー ]/g,'').length!==keep(v).length) showErr('ひらがなで入力してください');
    } };
  yomi.addEventListener('input',e=>{ AUTOKANA.manual = yomi.value.trim()!==''; if(!e.isComposing) hiraFix(); });
  yomi.addEventListener('compositionend',e=>{
    const {t,rd}=capYomi.finish(e.data);
    // 読みの欄で漢字に変換したら、変換前のかな（読み）に置き換える
    setTimeout(()=>{ if(t && rd && /[^ぁ-ゖァ-ヺー\s]/.test(t)){ const i=yomi.value.lastIndexOf(t); if(i>=0) yomi.value=yomi.value.slice(0,i)+rd+yomi.value.slice(i+t.length); }
      AUTOKANA.manual = yomi.value.trim()!==''; hiraFix(); },0);
  });
  yomi.addEventListener('blur',hiraFix);
  yomi.addEventListener('paste',()=>setTimeout(hiraFix,0));
  function tokenReading(tok){                       // 記録した（漢字→読み）の組み合わせで、この語を組み立てる
    const keys=Object.keys(AUTOKANA.pairs).sort((x,y)=>y.length-x.length), memo={};
    const go=i=>{ if(i===tok.length) return ''; if(i in memo) return memo[i];
      let r=null;
      for(const k of keys){ if(tok.startsWith(k,i)){ const rest=go(i+k.length); if(rest!==null){ r=AUTOKANA.pairs[k]+rest; break; } } }
      if(r===null && isKana(tok[i])){ const rest=go(i+1); if(rest!==null) r=tok[i]+rest; }   // かなのまま打った部分
      return memo[i]=r; };
    return go(0);
  }
  function fill(){
    const v=full.value.trim();
    if(!v){ AUTOKANA.manual=false; if(!AUTOKANA.manual) yomi.value=''; return; }
    if(AUTOKANA.manual) return;
    const toks=v.split(/[\s　]+/).filter(Boolean), out=[];
    for(const t of toks){ const r=tokenReading(t); if(r===null) return; out.push(r); }   // 一部の漢字を消した・貼り替えたなどで、読みを組み立てられないときは、読みの欄を触らない（全部消えるのは、姓名の欄が空のときだけ）
    yomi.value=toHira(out.join(' '));
  }
  AUTOKANA.reset=()=>{ AUTOKANA.pairs={}; AUTOKANA.last=''; AUTOKANA.manual=false; };
})();
document.getElementById('reset').addEventListener('click',()=>{
  for(const id of ['full','yomi','birth','birthT','zoku']) document.getElementById(id).value='';
  for(const id of ['sex','honmei']) document.getElementById(id).value='';
  STATE = {ov:{n:{},sel:{}}, flags:{tate:false,yoko:false,shibari:false}, yomikudashi:'auto'};
  AUTOKANA.reset();
  verdictHtml=''; document.getElementById('result').innerHTML='';
  document.getElementById('full').focus();
});
function syncHonmei(){ const b=parseBirth(); if(b) document.getElementById('honmei').value=STARS[kigaku(b).hon]; }
document.getElementById('go').addEventListener('click',()=>{ syncHonmei(); STATE.ov={n:{},sel:{}}; render(); });
for(const id of ['full','yomi','zoku','birth']) document.getElementById(id).addEventListener('keydown',e=>{ if(e.key==='Enter'){ syncHonmei(); STATE.ov={n:{},sel:{}}; render(); }});
for(const id of ['zoku','honmei','sex']) document.getElementById(id).addEventListener('change',render);
for(const id of ['birth','birthT']) document.getElementById(id).addEventListener('change',()=>{ const b=parseBirth(); if(b) document.getElementById('honmei').value=STARS[kigaku(b).hon]; render(); });

/* ================= 字典検索 ================= */
let qLimit=100;
function search(){
  const q = document.getElementById('q').value.trim();
  const qn = document.getElementById('qn').value;
  const qg = document.getElementById('qg').value;
  const qh = kata2hira(q);
  let res = DICT.filter(e=>{
    if(qn && e.n!==Number(qn)) return false;
    if(qg && e.g!==qg) return false;
    if(!q) return true;
    if([...q].some(ch=>/[㐀-鿿豈-﫿]/.test(ch))) return [...q].every(ch=>e.c===ch||e.k===ch) || e.c.includes(q) || e.k.includes(q);
    const toks = readingsOf(e);
    return toks.some(t=>t.includes(qh)) || kata2hira(e.y).includes(qh);
  });
  const total=res.length; res=res.slice(0,qLimit);
  document.getElementById('qinfo').textContent = `${total}件が見つかりました（全${DICT.length}件）。` + (total>qLimit?` 先頭の${qLimit}件を表示しています。`:'');
  document.getElementById('qres').innerHTML = `<table><thead><tr><th>字</th><th>鑑定字</th><th>鑑定数</th><th>五行</th><th>音訓</th><th>名乗り</th><th>辞典</th></tr></thead><tbody>`+
   res.map(e=>`<tr><td class="ch">${esc(e.c)}</td><td class="ch">${esc(e.k)}</td><td>${e.n}</td><td>${tag('none',e.g)}</td><td>${esc(e.y)}</td><td class="sub">${esc(e.a)}</td><td class="sub">p.${e.p}${e.f?' '+tag('warn','要確認'):''}</td></tr>`).join('')+`</tbody></table>`+
   (total>qLimit?`<p><button class="small" id="more">さらに100件表示</button></p>`:'');
  const m=document.getElementById('more'); if(m) m.addEventListener('click',()=>{ qLimit+=100; search(); });
}
for(const id of ['q','qn','qg']) document.getElementById(id).addEventListener('input',()=>{ qLimit=100; search(); });

/* ================= 画数の深義 ================= */
function kakuList(){
  const n=document.getElementById('kn').value, g=document.getElementById('kg').value;
  const rows=KAKUSU.filter(k=>(!n||k.n===Number(n))&&(!g||k.g===g));
  document.getElementById('kres').innerHTML=`<table><thead><tr><th>画数</th><th>総論</th><th>区分</th><th>人生の概観</th></tr></thead><tbody>`+
  rows.map(k=>`<tr><td><b>${k.n}</b></td><td>${esc(k.l)}</td><td>${tag(GCLS[k.g],GLAB[k.g])}<br><span class="sub">${k.ex?'本文':'判断'}</span></td><td>${esc(k.t)}${k.sho?`<br><span class="sub">正名：${esc(k.sho)}<br>凶名：${esc(k.kyo)}</span>`:''}</td></tr>`).join('')+`</tbody></table>`;
}
for(const id of ['kn','kg']) document.getElementById(id).addEventListener('input',kakuList);

function applyTheme(m){
  const r=document.documentElement;
  if(m==='light'||m==='dark') r.setAttribute('data-theme',m); else r.removeAttribute('data-theme');
  document.querySelectorAll('#theme button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
}

document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{

  for(const t of ['kantei','search','kaku']) document.getElementById('t-'+t).classList.toggle('hidden', t!==b.dataset.t);
