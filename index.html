<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>姓名鑑定</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1b2540">
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#23211d; --sub:#6b675f; --line:#dedad0;
  --good:#1f7a4d; --bad:#b3261e; --warn:#a86a00; --none:#7a766d; --accent:#2f4f7f;
  --good-bg:#e4f3ea; --bad-bg:#fbe7e5; --warn-bg:#fbf0d9; --none-bg:#eeece6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17181a; --panel:#202225; --ink:#ecebe6; --sub:#a5a299; --line:#34363a;
    --good:#66c796; --bad:#ff8a80; --warn:#f0b758; --none:#9a978e; --accent:#8fb1e8;
    --good-bg:#18332a; --bad-bg:#3a1f1d; --warn-bg:#3a2f16; --none-bg:#2a2b2e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17181a; --panel:#202225; --ink:#ecebe6; --sub:#a5a299; --line:#34363a;
    --good:#66c796; --bad:#ff8a80; --warn:#f0b758; --none:#9a978e; --accent:#8fb1e8;
    --good-bg:#18332a; --bad-bg:#3a1f1d; --warn-bg:#3a2f16; --none-bg:#2a2b2e;
  color-scheme:dark;
}
:root[data-theme="light"]{ color-scheme:light; }
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.theme{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.theme button{background:var(--panel);color:var(--sub);border:0;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.theme button+button{border-left:1px solid var(--line)}
.theme button.on{background:var(--accent);color:var(--bg);font-weight:700}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Hiragino Sans","Yu Gothic",system-ui,sans-serif}
header{padding:14px 16px 0;max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0 0 8px;letter-spacing:.05em}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);max-width:1100px;margin:0 auto;padding:0 16px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--sub);padding:10px 14px;font:inherit;cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px;color:var(--accent)}
h3{font-size:14px;margin:14px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--sub);gap:3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
input:not([type=checkbox]),select{height:40px;font-size:16px}
input.kanji{width:12em}
input.num{width:5em}
button.primary{background:var(--accent);color:#fff;border:0;border-radius:6px;height:40px;padding:0 22px;font:inherit;font-size:16px;cursor:pointer}
button.small{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap}
@media(max-width:700px){
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:6px 10px}
  td,th{border:0;padding:3px 0}
  td{display:flex;gap:10px;align-items:baseline;word-break:break-word}
  td::before{content:attr(data-label);flex:0 0 4.5em;color:var(--sub);font-size:12px}
  td:empty{display:none}
  td.ch{font-size:28px;line-height:1.2}
  td input.num,td select{max-width:100%}
}
td.ch{font-size:26px;line-height:1.2;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.verdict{border-radius:12px;padding:16px 20px;margin-bottom:14px;border:2px solid;display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap}
.verdict.good{background:var(--good-bg);border-color:var(--good)}
.verdict.bad{background:var(--bad-bg);border-color:var(--bad)}
.verdict .big{font-size:48px;font-weight:800;letter-spacing:.12em;line-height:1.1}
.verdict.good .big{color:var(--good)}
.verdict.bad .big{color:var(--bad)}
.verdict .lbl{font-size:12px;color:var(--sub)}
.verdict .why{flex:1;min-width:220px;font-size:14px;line-height:1.7}
@media(max-width:700px){.verdict{padding:14px 16px}.verdict .big{font-size:40px}}
.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}
.good{color:var(--good);background:var(--good-bg)}
.bad{color:var(--bad);background:var(--bad-bg)}
.warn{color:var(--warn);background:var(--warn-bg)}
.none{color:var(--none);background:var(--none-bg)}
.sub{color:var(--sub);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:4px}
.card .ttl{font-weight:700}
ul.pl{margin:4px 0;padding-left:1.2em}
.bar{display:flex;height:22px;border-radius:5px;overflow:hidden;border:1px solid var(--line);margin:6px 0}
.bar div{display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
@media(max-width:700px){.bar .bn{display:none}}
.yy{font-size:20px;letter-spacing:.2em}
.hidden{display:none}
details{margin:6px 0}
summary{cursor:pointer;color:var(--accent)}
pre.cfg{width:100%;min-height:150px;font:12px/1.5 ui-monospace,Menlo,monospace}
.mono{font-family:ui-monospace,Menlo,monospace}
@media (max-width:640px){ main{padding:10px} input.kanji{width:100%} }
</style>
</head>
<body>
<header><h1>姓名鑑定</h1><div class="theme" id="theme"><button data-m="auto">自動</button><button data-m="light">ライト</button><button data-m="dark">ダーク</button></div></header>
<nav id="tabs">
  <button data-t="kantei" class="on">鑑定</button>
  <button data-t="search">字典検索</button>
  <button data-t="kaku">画数の深義</button>
</nav>
<main>

<!-- ===== 鑑定 ===== -->
<div id="t-kantei">
<section class="panel">
  <h2>入力</h2>
  <div class="row">
    <label>姓名（姓と名をスペースで区切る）<input id="full" class="kanji" value="" placeholder="例 佐藤 太郎" autocomplete="off"></label>
    <label>読み（姓と名をスペースで区切る・任意）<input id="yomi" value="" placeholder="例 さとう たろう" autocomplete="off"></label>
    <label>生年月日（任意）<input id="birth" class="num" style="width:180px" inputmode="numeric" placeholder="例 1985/7/13" autocomplete="off"></label>
    <label>出生時刻（任意）<input id="birthT" type="time"></label>
    <label>性別（任意）
      <select id="sex"><option value="">指定なし</option><option value="m">男性</option><option value="f">女性</option></select>
    </label>
    <label>続柄（任意）<input id="zoku" value="" placeholder="例 長男" autocomplete="off"></label>
    <label>本命星（任意）
      <select id="honmei"><option value="">指定なし</option><option>一白水星</option><option>二黒土星</option><option>三碧木星</option><option>四緑木星</option><option>五黄土星</option><option>六白金星</option><option>七赤金星</option><option>八白土星</option><option>九紫火星</option></select>
    </label>
    <button class="primary" id="go">鑑定する</button>
  </div>
</section>
<div id="result"></div>
</div>

<!-- ===== 字典検索 ===== -->
<div id="t-search" class="hidden">
<section class="panel">
  <h2>字典検索</h2>
  <div class="row">
    <label>検索語（漢字・読み・名乗り）<input id="q" class="kanji" placeholder="例 崎 / たか / ひろ" autocomplete="off"></label>
    <label>画数<input id="qn" class="num" type="number" min="1" max="30" placeholder="全て"></label>
    <label>五行
      <select id="qg"><option value="">全て</option><option>木</option><option>火</option><option>土</option><option>金</option><option>水</option></select>
    </label>
  </div>
  <p class="sub" id="qinfo"></p>
  <div id="qres"></div>
</section>
</div>

<!-- ===== 画数の深義 ===== -->
<div id="t-kaku" class="hidden">
<section class="panel">
  <h2>画数の深義（1〜81画）</h2>
  <div class="row"><label>画数で絞る<input id="kn" class="num" type="number" min="1" max="81" placeholder="全て"></label>
  <label>区分<select id="kg"><option value="">全て</option><option>大吉</option><option>吉</option><option>中</option><option>凶</option><option>大凶</option></select></label></div>
  <div id="kres"></div>
</section>
</div>

<!-- ===== 設定 ===== -->
</main>

const KAKUSU = [{"n":1,"l":"根源","t":"1は天位にして父の格である。万物の根源を意味し、一切の頭となる大吉数である。陽を現して貴重な数となる。","g":"大吉","ex":1,"sho":"新気大吉。ゼロからの開拓精神、独立心、大事業の始動、指導者としての開花。","kyo":"わがまま、独善的態度、他者の意見排除による孤立、激しい対人摩擦。"},{"n":2,"l":"離散","t":"2は地の位にして母の格となる。分離、離散の意味を持ち、陰を現し、陰性で力弱く、破壊数となる大凶数。","g":"大凶","ex":1},{"n":3,"l":"成形","t":"3は人の位となる。産の意味を持ち、発達・発展を兆（きざ）す繁栄・吉祥・富裕の大吉数。また、ものの刷新や改革の意味をもち、計り知れない産を促す大慶賀の数である。","g":"大吉","ex":1,"sho":"発達発展。「産みの3」。旺盛な成長力と高い社会的地位の獲得。","kyo":"無計画な拡大、実体を伴わない空疎な発展、中途での頓挫。"},{"n":4,"l":"孤独","t":"4は何事も死して悲衰終局を現す。短命、身体の障害、病弱、孤独の恐れあり。苦労は重なる。","g":"凶","ex":0},{"n":5,"l":"完成","t":"天地の中心に位し、正しさを現す。身体健全の貴重な数で、天地の恵みを得て発展する大吉数であり、完成を現す。","g":"大吉","ex":1},{"n":6,"l":"吉凶中端","t":"財を意味し、頭領を示す。着実に努める時は、次第に財産の形成を見る。統率力があり、家庭内は和合する。その反面、苦労は多く、報われないことが多い。","g":"中","ex":1},{"n":7,"l":"独立","t":"独立を有する貴重な数である。何事にしても成就の意味があるが、独断専行になりやすく和合を欠く。常に自重を旨とする数である。","g":"吉","ex":0},{"n":8,"l":"上昇発展","t":"常に上昇発展を意味する。目標に向かって忍耐強く大志を維持し、福運が開ける吉数である。常に奉仕の精神を持たねば晩年は孤独。わがままな性格となり易いことに注意。","g":"吉","ex":1},{"n":9,"l":"孤独滅亡","t":"何事に対しても苦境に陥る。努力は報われず、孤独滅亡。身体に障害を得やすく、肉親に縁薄い。しかし忍耐は人一倍強く、それがかえって孤独を強める。妥協を許さず、衝突は多い。","g":"凶","ex":0,"sho":"鋭い直感力、切れ味のある才能、学術・芸術的開花。","kyo":"過度な鋭利さによる失言・暴言、口論、激しい人間関係の摩擦・対立。"},{"n":10,"l":"孤独（0数）","t":"充実を意味するが、充実の後、欠ける恐れあり。すべての努力が徒労に帰して、功を他人に奪われる。意志弱く、健康に恵まれず、家庭の縁は薄いことが多い。","g":"凶","ex":0},{"n":11,"l":"新規大吉","t":"新規を興し発展をなす大吉数。事業を興し、または養子に入って大成功。指導者となって名誉を得る。意義、天地の配合が整わない女性は、痴漢や暴行を受ける恐れあり。","g":"大吉","ex":1,"sho":"新気大吉。ゼロからの開拓精神、独立心、大事業の始動、指導者としての開花。","kyo":"わがまま、独善的態度、他者の意見排除による孤立、激しい対人摩擦。"},{"n":12,"l":"無理困難","t":"重荷の上にまた重荷を背負う形象。希望は大きいが支障はなお大きい。家庭、肉親の縁は薄く、分離、離散をくり返して最後は孤独。","g":"凶","ex":0,"sho":"堅実な積み重ね、特定分野での着実な進展。","kyo":"同じ失敗の無限繰り返し、進退極まる立ち往生、進展の完全停止。"},{"n":13,"l":"知望","t":"知望あり。創始、建設の才あって大成功する。産を重ねて旭日昇天のごとく、急進的に発展する。希望や目的は必ず成就する大吉数。姓名の意義が整わない者はホラ吹き、横着者多し。","g":"大吉","ex":1},{"n":14,"l":"万事不如意","t":"重死の意味を持つ。孤独、煩悶、苦難が重なる凶数。体力、財力が備わらず不平不満の人生となる。親不孝者は多い。","g":"凶","ex":1,"sho":"試練を乗り越える強い精神的鍛錬、過酷な環境への耐性。","kyo":"重死（重ねて死ぬ）。あり得ない重度の苦難（極貧・難病・破産等）が2度以上重複して発現する。"},{"n":15,"l":"立身出世","t":"旭日昇天のごとく立身出世。目上の敬愛を受け、溌刺たる精神をもって正しく発展する大吉数。わがままを抑えれば一層成功する。","g":"大吉","ex":1},{"n":16,"l":"頭領","t":"頭領となり、人を統率して事業を成功に導くが苦労は多い。波乱な人生となりやすい。意義悪ければ波乱浮沈の人生となろう。","g":"吉","ex":0},{"n":17,"l":"権威","t":"剛直、豪気、強情。善悪をはっきりし、物事の白黒をつけることに性急。ここに短気の元が生じる。人の反対を押し切って自己の意志を貫徹し、ついには成功する。じっくりと努力すれば幸福となろう。色恋の情が強いので注意。","g":"吉","ex":0},{"n":18,"l":"忍耐","t":"創始、建設の力は強く、自己の信念を貫いて生きれば必ず成功。また天地の恵みを得て幸福となる。ただし、姓名の意義が悪い場合は、軽率、口論が絶えず、大きな苦労が生じる。","g":"吉","ex":0,"sho":"創始建設。強い信念と突破力による大事業の構築、初志貫徹。","kyo":"警察トラブル・訴訟・口論の絶えなさ。破壊的な紛争・争訟に終始。"},{"n":19,"l":"内外不和","t":"新たなことを始めるが常にカンがはずれ、目算が狂って内外に不和を生じる。信念は強いが、それがかえって裏目に出て、無理がたたって大失敗。家庭はさみしく、肉親の縁は薄い。ただし意義善良なる時は、奉仕や宗教的なことに徹すれば成功する者もいる。","g":"凶","ex":0,"sho":"優れた知謀、特殊分野での才覚発現。","kyo":"家族・親族・身内との激しい解体・愛憎劇・離散。近親者との泥沼の抗争。"},{"n":20,"l":"発展中断","t":"発展していたものが何事も中断する凶数。一時は成功に向かうも不幸が重なり、ゼロをくり返す。財産をなくすか、身体を壊すか、いずれかになる。最も心配は、孤独が人生を支配すること。","g":"凶","ex":1},{"n":21,"l":"頭領","t":"常に発展、建設で新規事業を興し必ず成功する。知あり徳あって人を統率し、名誉を得る。苦労は必ず報われるという大吉数。成功者は多い。女性は万事ひかえめにすることだ。","g":"大吉","ex":1},{"n":22,"l":"変則孤独","t":"大望を実現しようとしても、万事意のごとくにならない。幼少から困難が多く、外見は華やかに見えるが内面は困難辛苦が続く。肉親と縁薄く孤独である。経済的な苦労は大きい。大凶数。","g":"大凶","ex":1},{"n":23,"l":"頭領","t":"知あって一躍大成功する。大志大望を抱いてそれを実現する大吉数、努力家は多い。女性は自己主張を除いて、やさしく生きることが幸福の条件。手八丁口八丁の器用もの。大吉人生だ。","g":"大吉","ex":1},{"n":24,"l":"忍耐","t":"正名の人は人を統率し、苦労するも大成功を収める。無から有を生じる吉数。俗に「嫁にもらうと倉が建つ」という。凶名の人は、財産、人生など、ことごとく無とする数である。","g":"吉","ex":1},{"n":25,"l":"確実鋭敏","t":"器用で万能者多く発展の数。大事大業を志して名誉を得る。学問職業には最適。経理には天才的な力あり。凶名の時は、傲慢でわがままで、色恋の問題を起こすだろう。","g":"吉","ex":0,"sho":"自力発展。強い自己主導権、吉運、着実な財産形成。","kyo":"自己中心的思考の肥大化、孤立無援、協調性の完全欠如。"},{"n":26,"l":"大海小舟","t":"本名には大凶、芸名には大吉。極端から極端に支配され、人生は大きな変化に翻弄される。困難と辛苦が交互にあり、一生平和は望めない。短命者多し。正名の時は赤貧から財をなす。","g":"大凶","ex":1,"sho":"波乱を乗り越える波乱万丈の英雄的才覚。","kyo":"大海に小舟。荒波に翻弄される不安定な人生。女性の場合は極めて過酷な悲運を招く。"},{"n":27,"l":"権威知望","t":"正名は権威あり、知望あり。正義を貫いて大望を成就する吉数。短気、異性関係に気をつければ人生は大成功。凶名は傲岸不遜で人を人と思わず、それによって物事は中断し分裂する。","g":"吉","ex":1},{"n":28,"l":"事故事件（孤独0数）","t":"人生の波風強く、家庭の恵みは少ない。無理を企て、大失敗して晩年は孤独。まれに中年までに大成功する者はいるが、それとても晩年まではすべて失う。事故、刑事事件多、大凶数。","g":"大凶","ex":1,"sho":"豪快な行動力、環境を一変させる変革力。","kyo":"波乱万丈。浮き沈みの激化、晩年における刑事事件・警察トラブルへの巻き込まれ。"},{"n":29,"l":"独立","t":"人に隠れた苦労はあるが、温厚な性格と人格が苦労に耐え、やがて大業を成し遂げる。行動しただけ必ず結果が伴う。幸福を得る吉数。","g":"吉","ex":1},{"n":30,"l":"自力発展","t":"積極に努力し建設の才あり。あらゆるものに工夫を加えて物事を進める。正名の場合は幸福を得る数である。選名に吉。晩年は孤独になりやすいので、精神的に豊かな生活を心がけること。凶名は努力が報われず失意の人生となる。","g":"吉","ex":0,"sho":"慎重なリスク管理、着実な足固め。","kyo":"報われない努力。生み出した全ての成果が完全にゼロへ回帰する悲運。"},{"n":31,"l":"努力","t":"精神は健康で器用な万能者。名誉と幸福を得て人生は豊か。何を手がけても成功する。人生の成功者が最も多い。凶名はわがまま、強欲。","g":"大吉","ex":0,"sho":"大吉。宇宙・社会との調和、隆盛、良好な対人、首尾一貫した成功。","kyo":"配合不全の場合、その威力が半減し、自主性の欠如として発現。"},{"n":32,"l":"僥倖","t":"最高貴の意味をもつ。知能才能に恵まれ、一気に成功する。これを僥倖という。しかし、普通の庶民には位負けする名前。晩年さみしく破産者は多い。明るく正しく生きれば越えよう。","g":"吉","ex":0},{"n":33,"l":"旭日昇天","t":"建設の才があり勇猛果敢、瞬間にして物事を判断、実行力は大きい。旭日昇天のごとく発展して名誉を得、成功する大吉数。人生の変化は大。","g":"大吉","ex":1,"sho":"権力・改革。急速な昇進、威厳、社会秩序の再構築。","kyo":"組織の不調和、強引な独裁による失脚、孤立無援。"},{"n":34,"l":"変則孤独","t":"才あり実行力もあるが、財力がこれに伴わない。財を得れば健康を害し、幸せとなれば急転して不幸に陥る。刑事事件の恐れある破産数。事業経営者にこの名前は多い、凶数。","g":"凶","ex":1},{"n":35,"l":"文学芸能","t":"計画、実行、判断、行動ともによい成功数。とりわけ文学、芸能には大吉数。経理関係の才能は多大。あらゆることに無理をすると崩れてしまう。慢心に注意。","g":"吉","ex":1},{"n":36,"l":"内外不和・破滅","t":"義侠心があり、尽くす心にあふれている。計画性や実行力もあり一時は成功するが、波乱の人生がこれを壊す。裸一貫から興して大成功する者がいる一方で多くは晩年孤独。失意の人生となる。刑罰、病気、異性関係の苦労で人生を壊す人多い。経営者に多いが、凶数。","g":"凶","ex":1},{"n":37,"l":"仁徳","t":"慈悲の心と実行力から衆望を集める。まじめに努力すれば、上下の信用を得て富貴幸福を得る。俗に「寝ていて倉が建つ」という。物事の白黒をハッキリつける心が強いと、人に嫌われるから注意。もともと人を許せる性格をもっているから、この長所を伸ばしてさらに成功。","g":"吉","ex":0},{"n":38,"l":"名誉","t":"産を重ねて発展する大吉数。明るく、出過ぎず、慎重に物事を行えば名誉を得る。奉仕活動、宗教などの利益を離れた活動をすれば大きな成功につながる。失敗する者はいない。","g":"大吉","ex":1},{"n":39,"l":"権威知望","t":"権威、智慧、財力と三拍子揃う大吉数。不足・不満の心を除いて努力すれば、安全平和の豊かな人生を得る。人生には必ず花が「咲く」。凶名は、短気、軽率にして剣難あり。","g":"大吉","ex":1,"sho":"三拍子（財力・権威・名誉）の開花。最高峰の栄誉。","kyo":"徒花（あだばな）。華やかに見えて実を結ばず、完全な衰退と破滅。"},{"n":40,"l":"吉凶中端","t":"養子などの改名には吉。精神は健康で忍耐力もある。正名の場合は名誉を得る吉数。凶名の場合は運命中断で剣難あり、孤独が支配する。","g":"中","ex":1,"sho":"精神的平穏、強固な実務能力、堅実な守り。","kyo":"運命中断・難中断。キャリアや人生が途中で強制終了・寸断される。"},{"n":41,"l":"大統領","t":"始終一番という暗示あり、何事にしても必ずトップになる。名誉幸福を得る大吉数。意志堅固で決意固く、努力実って大組織の頭領となる大吉数。正名でなければ波風高い。","g":"大吉","ex":1,"sho":"大統領数。圧倒的指導力、頂点への君臨、偉大な業績。","kyo":"「悪の大統領」（ダース・ベイダー化）。巨大なエネルギーが反転し、破壊的悪徳指導者へ変貌。"},{"n":42,"l":"博達","t":"改名選名等で意義善良なる時は、物心両面に恵まれ、工夫の力強く発明発見の才あり。命名の場合は、器用だが心がけ悪ければ失敗しやすい。晩年は健康を害し孤独になる人多し。","g":"吉","ex":0},{"n":43,"l":"吉凶中端","t":"成功者多いが、反面辛苦が絶えない。意義善良な者は無欲で建設の才あり、衆望を集める。凶名は欲が深く人と争う。何事も不満に感じるため人生を崩す。感謝の心で受け取れば吉。","g":"中","ex":1},{"n":44,"l":"変則滅亡","t":"滅亡。自己はもちろん一家、一族、国家までも滅ぼす大凶数。何をしても形をなさない。大凶中の大凶。変化は多く、人生に安定はない。","g":"大凶","ex":1},{"n":45,"l":"天地総合","t":"災害困難多いが大志つらぬいて、辛苦に耐え大業をなす。天地和合の徳をもって物心両面で恵まれ、名誉を得る、吉数。凶名は困難多い。","g":"吉","ex":1},{"n":46,"l":"変則0数","t":"貧しく生れれば財を得て成功し、富裕に生れては人生の労苦が絶えない。いずれにしろ波乱万丈の人生。晩年は孤独、貧困。","g":"凶","ex":0},{"n":47,"l":"異体同心","t":"共存共栄の徳あり、名誉発展の吉数。正しきことを好み、決断力あって物事を果敢に進める。","g":"吉","ex":1},{"n":48,"l":"知勇兼備","t":"知あり勇気あって衆望を得る。思慮は深く決断力、実行力共に備わり天のたすけを得て大発展する。事業経営者としては最適、大吉数。","g":"大吉","ex":1},{"n":49,"l":"片寄り変則（吉凶中端）","t":"一生苦労するの暗示あり。欲が深ければ人生は成功しない。自分勝手になりやすく、それによって誤解を受け、不義理をして非難攻撃の的となる。大きな事故や病気を招きやすい。","g":"中","ex":1},{"n":50,"l":"吉凶中端","t":"意義善良、正名の場合は和合統一の徳を有し、公に役立てば成功する。凶名の場合は欲深く、大を企てて失敗する。刑罰にあう大凶数。","g":"中","ex":1,"sho":"一時的な休息、保守的な防衛。","kyo":"弱気・不安定・無力感。人生の激しい乱高下と自己喪失。"},{"n":51,"l":"大望成就","t":"正義を人生の指針として努力すれば、天の助けを得て大成功。和合統一の徳あり。大衆の中心的存在となって大成功し、名誉を得る大吉数。できるだけ大きな望みを抱いて人生を計画したい。","g":"大吉","ex":1,"sho":"壮大な志、大規模な計画の立案。","kyo":"実体を伴わない膨大な野望、現実との乖離による大失速・激しい失望。"},{"n":52,"l":"独立自覚","t":"意義善良な場合は、思慮深く独立の信念あって若くから大志をいだき、至難とするところを成し遂げて成功する、貴重数。凶名はせっかくの才能を、自己の思い上がりですべて壊す。","g":"吉","ex":0},{"n":53,"l":"自力援助","t":"自力の力あって、才能もあり実行力もあるが生涯困難が離れない。正しいことを判断の基準において大衆を引率すれば、成功。","g":"中","ex":0},{"n":54,"l":"孤独","t":"意志強く努力を怠らない。やがて財を得るか名誉を得るが、両方は並び立たない。心労絶えず孤独の中で一生を送る。健康は恵まれない。","g":"凶","ex":0},{"n":55,"l":"（0数）","t":"意義善良な場合は無から有を生じ内外を統合して大成功。しかし多くは凶名で、意志薄弱、内外の平和を欠いて失意の人生となる。人格円満であれば大きな吉を呼ぶ。","g":"中","ex":0},{"n":56,"l":"独立","t":"人生の変化多し。興亡浮沈を繰り返す。意志は強いが災害に巻き込まれる可能性は大きい。人生の失敗が続く凶数である。","g":"凶","ex":1},{"n":57,"l":"忍耐努力","t":"中年まで困難は多い。頭は良く意志も強く、困難を乗り越えてやがて希望を成就する。晩年には名誉を受ける吉数である。","g":"吉","ex":1},{"n":58,"l":"自力","t":"堅忍不抜の気迫があり、才能もあり工夫もあって、苦労多いが必ず成功。周囲の意見を入れて努力すれば必ず成功する幸運数。","g":"吉","ex":1},{"n":59,"l":"臆病","t":"常に保守な立場に立ち、進取の気概に乏しいために人より遅れる、不幸数。老後は健康なるも孤独。会社名としては最も不向き。","g":"凶","ex":1,"sho":"慎重な自己保全、平穏な維持。","kyo":"臆病・保守的・遅れる不幸。時代の波に取り残される停滞と敗北。"},{"n":60,"l":"無方針","t":"目前の苦労に対して無策、何事も為さない。労して功少ない凶数。財に迷えば災害に遭い、知を求める時に財で悩む。","g":"凶","ex":1},{"n":61,"l":"忍耐幸福","t":"難に耐えて努力すれば必ず幸福を得る。影日向のない努力が、やがて衆望をます貴重数。","g":"吉","ex":0},{"n":62,"l":"孤独（0数）","t":"人生の内外に障害を生じる。ささいな苦労が連続し、一生寂しい人生。ただし意義善良な場合は、苦労を跳ねかえす意志は強く、努力の心が旺盛で人生を吉に転換する。","g":"凶","ex":0},{"n":63,"l":"吉祥","t":"努力によって、富貴と幸福を子孫に伝える幸運数。実行力は強い。陰陽・五行凶名の時は、災害に遭う可能性が高い。","g":"吉","ex":1},{"n":64,"l":"浮沈","t":"平穏無事に暮らす吉数であるが、実際は人生の波風が多い。精神的な苦労絶えず半吉数。","g":"中","ex":1},{"n":65,"l":"完全無欠","t":"周囲をまとめ大衆を統率し、天のたすけを受けて希望をかなえる幸運数。努力者多い。","g":"吉","ex":1},{"n":66,"l":"内外不和","t":"自身の内外ともに不和となる。人の意見を入れず、高慢、独断で人と争う。やがて大失敗する必数。どうしてこれ程の自信を持つのか。","g":"凶","ex":0},{"n":67,"l":"天祐","t":"才能あって創意工夫の心に満ちている。衆望を担って天のたすけあり。財産にも恵まれる大吉数。善悪の判断に間違いがない。","g":"大吉","ex":1},{"n":68,"l":"大天祐","t":"才能あり、発明心あり、創意工夫の心に満ちてよく大衆を統率する。話す言葉は明快、人間は明るく、天地のたすけを受けて自然と幸福を得る大吉数。誰からも尊敬されるだろう。","g":"大吉","ex":1},{"n":69,"l":"波乱曲折","t":"人生に波乱多く、精神悩みが止まる時はない。努力しても報われることは少ない。","g":"凶","ex":0},{"n":70,"l":"無為無能","t":"家庭に恵まれず、経済的にも恵まれず、何をしても成功とは遠い凶数。","g":"凶","ex":1},{"n":71,"l":"進取発展","t":"何事に対しても知識あり、進取の精神に富んでいるが物事を決断しない。その短所を乗り越え、実行力を身につければ幸福を得る。","g":"中","ex":0},{"n":72,"l":"大望中断","t":"中年にいたって人生は波瀾万丈、大望は中断する。晩年は孤独となりやすい。","g":"凶","ex":0},{"n":73,"l":"堅忍努力","t":"大望を抱き努力の気もあるが、初志を貫徹する勇気が乏しく成就は難しい。独立心を持ち、よく忍耐を保って努力すれば、生まれついての幸運を発揮して安楽を得る。","g":"中","ex":0},{"n":74,"l":"無知無能","t":"才能があってもこれを表に現さず、常に苦労あって不時の災難に泣き、逆境に迷う凶数。","g":"凶","ex":1},{"n":75,"l":"独立","t":"才能あって、統率心旺盛。自然の恩恵を受けて諸事成就する吉数。血気にはやって独断専行すれば、身を誤り思わぬ失敗を招く。","g":"吉","ex":1},{"n":76,"l":"破産","t":"自己の内外ともに不和、破産。一家離散の悲運に遭遇する凶数。","g":"凶","ex":1},{"n":77,"l":"吉凶中端","t":"この人の多くは、中年まで支障なく人生を歩むが、晩年に大きな不幸を招く。人生の前半に困苦あれば、晩年は安定する。","g":"中","ex":1},{"n":78,"l":"向上発展","t":"常に向上の心あって努力心は旺盛、才能あって大衆を統率する。しかし晩年に大辛苦あり。","g":"中","ex":0},{"n":79,"l":"困難","t":"身体健全であらゆることに耐える体をもつが、中年になって一気にその健康を失う。節操なく高慢で信用を失い、悲運の一生となる凶数。","g":"凶","ex":1},{"n":80,"l":"（0数）","t":"一生困難、苦労は絶えない。ただし宗教家となるか終生ボランティア活動に挺身すれば幸運な人生が発展する。","g":"凶","ex":0},{"n":81,"l":"極数","t":"最極の数にして天の位。吉祥・富貴を呼ぶ貴重数。1の位に戻る。","g":"吉","ex":0}];               // 鑑定ハンドブック p.111-126「画数の深義」（1〜81画）

const KANA_STROKE = {'あ':2,'い':2,'う':3,'え':3,'お':3,'か':2,'き':3,'く':2,'け':3,'こ':2,'さ':3,'し':3,'す':2,'せ':2,'そ':2,
  'た':3,'ち':3,'つ':3,'て':3,'と':2,'な':2,'に':2,'ぬ':2,'ね':4,'の':1,'は':2,'ひ':2,'ふ':1,'へ':1,'ほ':4,

const KANA_SMALL = {'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','っ':'つ','ゃ':'や','ゅ':'ゆ','ょ':'よ','ゎ':'わ'};
const KANA_GYO = (()=>{ const m={}; const add=(g,cs)=>{ for(const c of cs) m[c]=g; };
  add('木','かきくけこ'); add('火','たちつてとなにぬねのらりるれろ'); add('土','あいうえおやゆよわを'); add('金','さしすせそ'); add('水','はひふへほまみむめも'); return m; })();
function kanaEntry(ch){
  const d = kata2hira(ch).normalize('NFD'); const base0=[...d][0]; const base = KANA_SMALL[base0]||base0;
  if(!(base in KANA_STROKE)) return null;
  const mark = d.includes('\u3099') ? 2 : d.includes('\u309a') ? 1 : 0;
  // 濁音・半濁音の五行は、清音の行と同じ
  return {c:ch, k:'', n:KANA_STROKE[base]+mark, g:KANA_GYO[base]||'', m:'', y:'', a:'', p:0, f:0, kana:1};
}
function lookupChars(str){
  let prev='';
  return [...str].map(ch=>{
    const key = (ch==='々' && prev) ? prev : ch;   // 々は直前の字として数える
    prev = key;
    let list = BYCHAR.get(key)||[];
    if(!list.length && /[ぁ-ゖァ-ヺ]/.test(key)){ const e=kanaEntry(key); if(e){ e.y = ''; list=[e]; } }
    return {ch, list, sel:0};
  });
}
function readingsOf(entry){
  if(entry.kana) return [kata2hira(entry.c)];
  // 音読み（ひらがな）／訓読み／名乗り
  const out = [];
  const y = (entry.y||'').replace(/[（(][^）)]*[）)]/g,'');
  const [onPart, kunPart=''] = y.split('／');
  for(const t of onPart.split(/[・\s]/)) if(t) out.push(kata2hira(t));
  for(const t of kunPart.split(/[・\s]/)) if(t) out.push(t);
  for(const t of (entry.a||'').split(/[・\s]/)) if(t) out.push(t.replace(/[「」]/g,''));
  return [...new Set(out.filter(t=>/^[ぁ-ゟー]+$/.test(t)))];
}
const devoice = s => s.replace(/[がぎぐげござじずぜぞだぢづでどばびぶべぼ]/g, c=>String.fromCharCode(c.charCodeAt(0)-1))
                      .replace(/[ぱぴぷぺぽ]/g, c=>String.fromCharCode(c.charCodeAt(0)-2));
function alignReading(reading, charInfos){
  // 読みを漢字ごとに切り分けられるかの目安（当て字の疑い判定用）
  const R = reading, n = charInfos.length;
  const cand = charInfos.map(ci=>{
    const toks = new Set();
    for(const e of ci.list) for(const t of readingsOf(e)) toks.add(t);
    return [...toks];
  });
  const memo = new Map();
  function dfs(i,p){
    if(i===n) return p===R.length;
    const key=i+','+p; if(memo.has(key)) return memo.get(key);
    let ok=false;
    for(const t of cand[i]){
      const lens = new Set([t.length]); if(t.length>=3) lens.add(2); if(t.length>=2) lens.add(1);
      for(const L of lens){
        const piece = t.slice(0,L);
        const seg = R.slice(p,p+L);
        if(seg.length===L && (seg===piece || devoice(seg)===devoice(piece))){ if(dfs(i+1,p+L)){ok=true;break;} }
      }
      if(ok) break;
    }
    memo.set(key,ok); return ok;
  }
  if(cand.some(c=>c.length===0)) return null; // 辞典に無い字がある
  return dfs(0,0);
}

function compute(seiStr, meiStr, ov){
  const sei = lookupChars(seiStr), mei = lookupChars(meiStr);
  const all = [...sei, ...mei];
  all.forEach((c,i)=>{ c.idx=i; c.part = i<sei.length?'sei':'mei'; });
  const strokes = all.map(c=>{
    if(ov && ov.n && ov.n[c.idx]!=null && ov.n[c.idx]!=='') return Number(ov.n[c.idx]);
    if(ov && ov.sel && ov.sel[c.idx]!=null) c.sel = ov.sel[c.idx];
    const e = c.list[c.sel]; return e? e.n : null;
  });
  all.forEach((c,i)=>{ c.n=strokes[i]; c.entry=c.list[c.sel]||null; });
  return {sei, mei, all};
}
function parts(seiN, meiN){
  const sum = a=>a.reduce((x,y)=>x+y,0);
  const s0=seiN[0], sL=seiN[seiN.length-1], m0=meiN[0], mL=meiN[meiN.length-1];
  return {
    tenkaku: sum(seiN), jinkaku: sL+m0, chikaku: sum(meiN), soukaku: sum(seiN)+sum(meiN),
    tensuu: s0, chisuu: m0, teisuu: mL
  };
}

function judgeMeaning(seiStr, meiStr, yomi, zoku, baseBad, sex){
  const items=[]; const hits=[];
  for(const [pat,pos,,note] of KYOSOU){
    if(pos==='any'){
      if(meiStr.includes(pat)) hits.push({where:'名',pat,note});
      else if(seiStr.includes(pat)) hits.push({where:'姓（参考）',pat,note,ref:true});
    }else if(pos==='name'){
      // 名全体がその名であるときだけ（読みが字の境目をまたいで一致しても当てない：例 啓祐＝たかよし に「かよ」）
      if(meiStr===pat || (yomi && yomi===pat)) hits.push({where:'名',pat,note});
    }else if(pos==='nameHead'){
      if((pat==='朝'||pat==='麻') && sex==='m') continue;
      if(meiStr.startsWith(pat) || (pat==='心' && ((yomi && yomi.startsWith('こころ')) || kata2hira(meiStr).startsWith('こころ')))) hits.push({where:'名',pat,note});
      else if(pat==='人' && meiStr.length===1 && meiStr==='人') hits.push({where:'名',pat,note});
    }
  }
  for(const h of hits) items.push({st:h.ref?'warn':'bad', t:`凶相文字「${h.pat}」（${h.where}）`, d:h.note});
  // 長男・次男の逆転
  if(zoku==='chou' && [...meiStr].some(c=>JI_CHARS.includes(c))) items.push({st:'bad',t:'長男に次男の字',d:'家督をめぐる紛争、能力を発揮できない、組織内の下克上を招く。'});
  if(zoku==='ji' && [...meiStr].some(c=>CHOU_CHARS.includes(c))) items.push({st:'bad',t:'次男に長男の字',d:'家督をめぐる紛争、能力を発揮できない、組織内の下克上を招く。'});
  if(baseBad!==null && baseBad!==undefined){
    for(const ch of new Set([...meiStr])){
      const d=DUAL[ch]; if(!d) continue;
      items.push(baseBad ? {st:'bad',t:`「${ch}」は薬が毒に転じます`,d:`${d[0]}他の真理に凶があるため、${d[2]}`}
                         : {st:'good',t:`「${ch}」は薬として働きます`,d:`${d[0]}他の真理に凶がないため、${d[1]}`});
    }
  }
  if(!items.length) items.push({st:'good',t:'凶相文字',d:'レポートに挙げられた凶相文字は見当たりません。'});
  return items;
}

  const kanaName = isKanaOnly(meiStr||'') ? kata2hira(meiStr) : '';     // 名をひらがなで表記している場合
  const reading = yomi || kanaName;
  if(!reading){ items.push({st:'none',t:'読み',d:'名の読みを入力すると、濁音・当て字の疑い・名頭の音を調べます。'}); return items; }
  // 濁音・「ン」は、仮名（ひらがな）表記のときだけ問題とする（講義：「健治」OK／「けんじ」NG、「純也」OK）
  const kanaPart = kata2hira([...(meiStr||'')].filter(c=>/[ぁ-ゖァ-ヺ]/.test(c)).join(''));
  if(DAKUON.test(kanaPart)) items.push({st:'bad',t:'ひらがな表記に濁音を含む',d:'人生に余分なものがついてくる。本来負う必要のない余分な苦労・トラブル・他人の債務や子供の面倒などが付き纏う。'});
  else if(yomi && DAKUON.test(yomi)) items.push({st:'good',t:'濁音',d:'読みに濁音がありますが、漢字表記なら問題ありません（ひらがな表記だと凶）。'});
  else items.push({st:'good',t:'濁音',d:'濁音は含まれません。'});
  if(kanaPart.slice(0,-1).includes('ん')) items.push({st:'warn',t:'名の途中に仮名の「ん」',d:'途中の「ん」は△。語尾の「ん」ほどは悪くないが、好ましくありません。'});
  // 「ん」止まりは、ひらがな表記のときだけ
  if(/ん$/.test(kata2hira(meiStr||''))) items.push({st:'bad',t:'ひらがな表記で「ん」で終わる',d:'音の進行が止まる打ち止めの構造。人生の進展・事業の拡大がそこで天井にぶつかる。'});
  else if(yomi && yomi.endsWith('ん')) items.push({st:'good',t:'「ん」止まり',d:'漢字表記の読みに含まれる「ん」は、打ち止めの凶構造にはなりません。'});
  // 名頭の凶音
  const head = SOUND_HEAD.find(([h])=>reading.startsWith(h));
  if(head) items.push({st:'bad',t:`名頭の音「${head[0]}」`,d:head[1]});
  if(yomiSei){
    const K=[...yomiSei].filter(c=>c!=='ー'), M=[...reading].filter(c=>c!=='ー');
    const rep_=[];
    if(K.length&&M.length && K[0]===M[M.length-1]) rep_.push(`姓の最初の音「${K[0]}」と名の最後の音「${M[M.length-1]}」`);
    if(rep_.length) items.push({st:'bad',t:'同一音の重複',d:`${rep_.join('、')}が同じ音です。姓と名にまたがって同じ音が反復する構造は、同じ苦労や失敗を繰り返す凶名とされます。`});
    else items.push({st:'good',t:'同一音の重複',d:'姓と名にまたがる同じ音の反復は見当たりません。'});
  }
  if(!kanaName){
    const al = alignReading(reading, meiChars);
    if(al===null) items.push({st:'none',t:'音と字の対応',d:'辞典に無い字があるため調べられません。'});
    else if(al) items.push({st:'good',t:'音と字の対応',d:'読みを、辞典の音訓・名乗りで漢字ごとに切り分けられます。'});
    else items.push({st:'warn',t:'当て字の疑い',d:'辞典の音訓・名乗りでは読みを切り分けられません。音と意味が解離していると、思考と行動の乖離・情緒不安定を招く。ただし名乗りの収録漏れの可能性もあります。'});
  }
  return items;
}

/* 五行 */
function judgeGogyo(chars, seiLen){
  // 五行は字音（辞典の五行＝音読みの行）だけで判定する
  const items=[]; let st='good';
  const a = chars.map(c=>c.entry?c.entry.g:null);
  const line = `字音の五行：${a.map((g,i)=>chars[i].ch+(g||(chars[i].ch==='ん'?'（五行なし）':'？'))).join('　')}`;
  const hit=(cls)=>{ if(cls==='bad') st='bad'; else if(cls==='warn' && st!=='bad') st='warn'; };
  const BAD_PAIR=['火火','水水','火水','水火'];
  const x=a[seiLen-1], y=a[seiLen];
  if(x&&y){
    if(BAD_PAIR.includes(x+y)){ items.push({st:'bad',t:`人格接続部が${x}－${y}`,d:'人格接続部（姓の最後の字と名の最初の字）の火－火・水－水・火－水・水－火は、無条件で大凶。'}); hit('bad'); }
    else if(x+y==='火金'||x+y==='金火'){ items.push({st:'warn',t:`人格接続部が${x}－${y}（火克金）`,d:'火が金を攻める相克の配置です。火が金を溶かし、財産・家族の結束・身体基盤を損なうとされます。大凶とされる火火・水水・火水・水火には当たりません。'}); hit('warn'); }
    else items.push({st:'good',t:'人格接続部',d:`${x}－${y}で、火火・水水・火水・水火にも、火克金にも当たりません。`});
  }else items.push({st:'none',t:'人格接続部',d:'辞典に無い字があるため判定できません。'});
  if(chars.length>=3 && a.every(Boolean)){
    const k=new Set(a).size;
    if(k===1){ items.push({st:'bad',t:'五行が1種類に集中',d:'極端な集中。その五行に対応する病気や性格の偏りを引き起こす。'}); hit('bad'); }
    else if(k===2){ items.push({st:'warn',t:'五行が2種類のみ',d:'五行は3種類以上が理想。2種類以下への偏りは、その五行に対応する病気や性格の偏りを引き起こす。'}); hit('warn'); }
    else items.push({st:'good',t:'五行の種類',d:k>=4?`${k}種類あり、非常に良い配置です。`:`${k}種類あり、理想の3種類以上です。`});
  }
  const pairs=[];
  if(x&&y) pairs.push({n:'人格（姓の最後の字と名の最初の字）',a:x,b:y});
  if(chars.length-seiLen>=2){ const m0=a[seiLen], m1=a[a.length-1]; if(m0&&m1) pairs.push({n:'地格（名の最初の字と最後の字）',a:m0,b:m1}); }
  return {st, items, line, pairs};
}
/* 陰陽（姓名鑑定講座・ハンドブックの鑑査基準） */
function inyouBlock(m){
  if(m.length===1) return {b:[m[0],m[0]], note:'1文字のため、同じ陰陽がもう1つあると見立てます。'};
  if(m.length===2) return {b:m, note:''};
  const r=[]; for(const x of m) if(!r.length||r[r.length-1]!==x) r.push(x);
  if(r.length===1) return {b:[r[0],r[0]], note:'同じ陰陽の連続を1つにまとめました。'};
  if(r.length===2) return {b:r, note:'同じ陰陽の連続を1つにまとめました。'};
  return {b:[r[0],r[r.length-1]], note:'3つ以上の交互配列のため、最初と最後の陰陽で見立てました（暫定）。'};
}

function judgeInyou(seiN, meiN, honmei, flags){
  const sb=inyouBlock(seiN.map(n=>isYang(n)?1:0)), mb=inyouBlock(meiN.map(n=>isYang(n)?1:0));
  const bits=[...sb.b,...mb.b]; const key=bits.join('');
  const std = bits.map(x=>x?'〇':'●'); const stdStr = `${std[0]}${std[1]}／${std[2]}${std[3]}`;
  const [name,cls,desc]=INYOU_PAT[key];
  const items=[]; const notes=[sb.note&&('姓：'+sb.note), mb.note&&('名：'+mb.note)].filter(Boolean);
  items.push({st:cls,t:name,d:desc});
  if(meiN.length===1) items.push({st:'bad',t:'一文字名前',d:'名前だけでは陽と陰の対を作れず、命が半分の状態。若年期に急成功してもエネルギーを使い果たして不安定になる。原理的に凶相（原則使用不可）。'});
  const star = honmei? honmei.slice(0,2):'';
  if(name.startsWith('蒔き直し') && (star==='三碧'||star==='四緑')) items.push({st:'bad',t:'蒔き直しと三碧・四緑',d:'木星は伸びてはやり直す性質を持つため、成果直前の挫折・リセットが著しく強烈に現れる。'});
  if(name.startsWith('縛り') && ['二黒','五黄','八白'].includes(star)) items.push({st:'warn',t:'縛りと土星',d:'土星は保守的で地道な環境に耐性があり、縛りの配列でも比較的苦にならない。'});
  if((name.startsWith('縛り')||name==='中断') && ['九紫','六白'].includes(star)) items.push({st:'bad',t:`${name==='中断'?'中断':'縛り'}と${star}`,d:'抑圧への不満や葛藤が激しく噴出し、頭部の疾患・激しい人間関係の衝突・突然の破滅を引き起こしやすい。'});
  if(name==='中断'){
    if(star==='一白'||star==='九紫') items.push({st:'bad',t:'中断と本命星',d:'本命が一白水星・九紫火星の場合、中断の凶作用は2倍以上になる。'});
    if(flags && flags.tate) items.push({st:'bad',t:'中断と縦分離名',d:'縦分離名が重なると、中断の凶作用は2倍以上になる。'});
  }
  const st = (cls==='good' && !items.some(i=>i.st==='bad'))?'good':'bad';
  return {st, std:stdStr, notes, items};
}
/* 画数（ハンドブック「画数の深義」） */
const GCLS = {'大吉':'good','吉':'good','中':'warn','凶':'bad','大凶':'bad'};
const GLAB = {'大吉':'大吉','吉':'吉','中':'吉凶中端','凶':'凶','大凶':'大凶'};
const foldN = v => v>81 ? ((v-1)%80)+1 : v;   // 81画で1に戻る
function kakuInfo(v){
  const n=foldN(v), base=KAKU_BY[n]; if(!base) return null;
  const g = (KAKU && KAKU[String(v)]) || (KAKU && KAKU[String(n)]) || base.g;
  return {n, v, base, g, over:g!==base.g};
}
function judgeKaku(P, kyoOther){
  const rows=[]; let bad=false, good=0, warn=false, strong=false;
  const parts_=[['人格',P.jinkaku,'中年期（数え28〜54歳）'],['地格',P.chikaku,'初年期（数え1〜27歳）'],['総格',P.soukaku,'晩年期（数え55歳〜）'],['地数',P.chisuu,'全生涯の基盤（最重要部位）']];
  for(const [n,v,role] of parts_){
    const k=kakuInfo(v); const notes=[];
    let g=k.g; const nn=k.n;
    // 講義レジュメ（4-5 画数）の扱い
    if([19,20,24,44,49].includes(nn)){ g = g==='大凶'?'大凶':'凶'; notes.push('命名・選名のどちらも×。'); }
    if(n!=='総格' && [9,19].includes(nn)){ g = g==='大凶'?'大凶':'凶'; notes.push('人格・地格・地数では×。'); }
    if([12,14,22].includes(nn)){
      if(n==='総格'){ g = g==='大凶'?'大凶':'凶'; notes.push('総画はNG。'); }
      else { g = kyoOther ? '凶' : '中'; notes.push('五大真理が整っていればOK（総画はNG）。'); }
    }
    if(nn===32) notes.push('選名ならOK。気品のある高貴な名前なら可。命名でつけると体が弱くなりやすい。');
    else if([30,40,42,43,50,52,53].includes(nn)) notes.push('選名ならOK（命名では避ける）。');
    if(n==='総格' && [26,35].includes(nn)) notes.push('総画26・35は芸名なら◎。私生活の問題が重い。');
    if(n==='総格' && [25,35].includes(nn)) notes.push('総画25・35は計算力が高く、会計に向く。');
    const cls=GCLS[g]; if(cls==='bad') bad=true; else if(cls==='good') good++; else warn=true;
    if(STRONG_NUMS.includes(nn)) strong=true;
    rows.push({n,v,role,k:{...k,g},cls,notes});
  }
  const refs=[['点数',P.tensuu,'家系の入口（姓の最初の字）'],['定数',P.teisuu,'結末・着地点（名の最後の字）']].map(([n,v,role])=>({n,v,role,k:kakuInfo(v)}));
  const st = bad?'bad':(good===rows.length?'good':'warn');
  return {st, rows, refs, strong};
}

/* 天地・天底（Googleドキュメント「天地・天底の配合」の鑑査基準） */
function judgeTenchi(P, honmei, upper){

  const items=[]; let st='good';

    let extra='';
    if(honmei && (honmei.startsWith('六白')||honmei.startsWith('五黄'))) extra+='本命星が六白・五黄のため、最も強く揉めます。';
    if(P.tenGyo==='火') extra+='火の五行の天地同数は、最も強く揉める・暴走するとされます。';
    add('bad',`天地同数（点数${ten}画・地数${chi}画）`,'大凶を超える大凶。天と地が張り合って離れ、直属の上司・社長・目上との関係が決裂・衝突します。肉体と精神の分離や難病など、健康も著しく害されるとされます。'+extra);
  }
  // 天地衝突
  const clash = n => [3,5,9].includes(n%10);
  if(ten!==chi && clash(ten) && clash(chi)){
    add('bad',`天地衝突（点数${ten}画・地数${chi}画）`,'凶の相。感情的な喧嘩・反発が激しく、直属の上司・責任者・目上に突っかかりやすい。上下関係にネジレが生じて物別れとなり、実りや収入に結びつきにくい。画数が大きいほど強まります。');
  }

  if(P.tenkaku===P.chikaku){
    add('bad',`天地相同数（天格${P.tenkaku}画・地格${P.chikaku}画）`,'大凶を超える大凶（大事件数）。やること成すことが裏目に出る。活動や事業の規模が小さいうちは目立たないが、規模が拡大した途端に破滅的な大トラブルへ発展するため、組織・会社に入れてはならない名前とされます。');
  }
  // 天大地小・天小地大（講義：画数の差の定義は無い。目安は「概ね2倍を超える」画数の不均衡と、文字数の上下バランス）
  const big=Math.max(P.tenkaku,P.chikaku), small=Math.min(P.tenkaku,P.chikaku);
  const DAI='頭で考えるのは得意だが、行動力・実行力に欠ける頭でっかち・足元虚弱。精神のバランスを崩しやすく、ノイローゼや頭部・脳の疾患が出やすい傾向。';
  const SHO='足元（行動力）は強いが、深く考えずに動いて先々でトラブル・障害・摩擦を起こしやすい。';
  let dai=null, sho=null;
  const ratio = big/small;
  if(ratio>=1.8){
    const w = ratio>2 ? '2倍を超えています' : '約2倍です';
    if(P.tenkaku>P.chikaku) dai=`天格${P.tenkaku}画が地格${P.chikaku}画の${w}。`; else sho=`地格${P.chikaku}画が天格${P.tenkaku}画の${w}。`;
  }
  if(P.seiLen>=4 && P.meiLen===1){ dai=(dai?dai+'また、':'')+`${P.seiLen}文字の苗字に1文字の名前で、上が重すぎます（4文字苗字なら名前は最低2文字、できれば3文字）。`; }
  if(P.seiLen===1 && P.meiLen>=3){ sho=(sho?sho+'また、':'')+`1文字の苗字に${P.meiLen}文字の名前で、下が重すぎます。`; }
  if(dai) add('warn','天大地小',dai+DAI);
  if(sho) add('warn','天小地大',sho+SHO);
  if(!items.length) items.push({st:'good',t:'天地の配合',d:`天地同数・天地衝突・天地相同数・天大地小・天小地大のいずれにも当たりません（天大地小・天小地大は、画数が2倍程度（1.8倍以上）離れているか、文字数の上下が極端に偏っているかで判定）。`});
  const tenchiSt = st;

function termMs(lon,y,m,d){          // 太陽黄経lonに達する時刻(ms)。y-m-d付近
  const f=jd=>((sunLon(jd)-lon+540)%360)-180;

  const truths = [
    {name:'読み下し', w:30, st:yomiSt},
    {name:'五行', w:20, st:gogyo.st},
    {name:'陰陽', w:20, st:inyou.st},
    {name:'天地・天底の配合', w:20, st:tenchi.st},
    {name:'画数（格数）', w:10, st:kaku.st},
  ];
  const colors={good:'#1f7a4d',warn:'#c98a00',bad:'#b3261e',none:'#8d8a82'};
  h+=`<section class="panel"><h2>手順3　五大真理による統合評価</h2>
   <div class="bar">${truths.map(t=>`<div style="width:${t.w}%;background:${colors[t.st]}"><span class="bn">${t.name} </span>${t.w}%</div>`).join('')}</div>
   <div class="grid">`;
  // 読み下し
  const hint = [...sound,...shape,...mean].filter(i=>i.st==='bad').map(i=>i.t);
  h+=`<div class="card"><div class="hd"><span class="ttl">1　読み下し（30%）</span>${stTag(yomiSt)}</div>
     ${hint.length?`<p class="sub">手順2で見つかった凶相：${esc(hint.join('、'))}</p>`:''}
     <select id="yomikudashi"><option value="auto" ${STATE.yomikudashi==='auto'?'selected':''}>手順2から自動</option><option value="none" ${STATE.yomikudashi==='none'?'selected':''}>未判定</option><option value="good" ${STATE.yomikudashi==='good'?'selected':''}>吉</option><option value="warn" ${STATE.yomikudashi==='warn'?'selected':''}>注意</option><option value="bad" ${STATE.yomikudashi==='bad'?'selected':''}>凶</option></select></div>`;
  // 五行
  h+=`<div class="card"><div class="hd"><span class="ttl">2　五行（20%）</span>${stTag(gogyo.st)}</div>
     <p>${esc(gogyo.line)}</p>${list(gogyo.items)}
     ${gogyo.pairs.map(pr=>{ const d=GOGYO_PAIR[pr.a+pr.b]; if(!d) return ''; const kyo=truths.some(t=>t.st==='bad');
       return `<details open><summary>${esc(pr.n)}　${pr.a}－${pr.b}</summary>${kyo?`<p><b>凶名の性質</b>：${esc(d[1])}<br><b>体質</b>：${esc(d[2])}</p>`:`<p><b>${d[3]?'準正名':'正名'}の性質</b>：${esc(d[0])}</p>`}</details>`; }).join('')}</div>`;
  // 陰陽
  h+=`<div class="card"><div class="hd"><span class="ttl">3　陰陽（20%）</span>${stTag(inyou.st)}</div>
     <p class="yy">${esc(inyou.std)}</p><p class="sub">${all.map(c=>c.ch+c.n).join('　')}</p>
     ${inyou.notes.length?`<p class="sub">${esc(inyou.notes.join(' '))}</p>`:''}${list(inyou.items)}</div>`;
  // 天地天底
  h+=`<div class="card"><div class="hd"><span class="ttl">4　天地・天底の配合（20%）</span>${stTag(tenchi.st)}</div>
     <h3>天地の配合　${stTag(tenchi.tenchi.st)}</h3>${list(tenchi.tenchi.items)}
     <h3>天底の配合　${stTag(tenchi.teitei.st)}</h3>${list(tenchi.teitei.items)}</div>`;
  // 画数
  const kyoNow = [yomiSt, gogyo.st, inyou.st, tenchi.st].includes('bad');   // 画数以外の真理に凶があるか
  const kEff = r => {
    const b=r.k.base;
    if(b.sho) return kyoNow ? `<p><b>凶名の作用</b>（画数以外の真理に凶があるため）：${esc(b.kyo)}</p>` : `<p><b>正名の作用</b>（画数以外の真理に凶がないため）：${esc(b.sho)}</p>`;
    if(kyoNow && GCLS[r.k.g]==='good') return '<p class="sub">画数以外の真理に凶があるため、吉数の作用は十分に発揮されません。</p>';
    return '';
  };
  const kLine = r => `<details open><summary>${r.n}　${r.v}画${r.v!==r.k.n?'（'+r.k.n+'画として）':''}　${r.role}　${tag(GCLS[r.k.g],GLAB[r.k.g])}　<b>${esc(r.k.base.l)}</b></summary><p>${esc(r.k.base.t)}</p>${kEff(r)}${(r.notes||[]).length?`<p class="sub">講義：${esc(r.notes.join(' '))}</p>`:''}</details>`;
  h+=`<div class="card" style="grid-column:1/-1"><div class="hd"><span class="ttl">5　画数（10%）</span>${stTag(kaku.st)}</div>
     ${kaku.rows.map(kLine).join('')}
     <h3>参考（判定には使いません）</h3>
     ${kaku.refs.map(r=>`<p>${r.n}　${r.v}画　${r.role}　${tag(GCLS[r.k.g],GLAB[r.k.g])}　<b>${esc(r.k.base.l)}</b><br><span class="sub">${esc(r.k.base.t)}</span></p>`).join('')}</div>`;
  h+=`</div>`;
  // 統合：凶が1つでも該当すれば凶名、どれも該当しなければ正名
  const badT = truths.filter(t=>t.st==='bad').map(t=>t.name);
  const kyomei = badT.length>0;
  const dark = badT.slice(0,4).length && kaku.strong;
  verdictHtml=`<div class="verdict ${kyomei?'bad':'good'}">
   <div><div class="lbl">統合判定　${esc(seiStr)} ${esc(meiStr)}</div><div class="big">${kyomei?'凶名':'正名'}</div></div>
   <div class="why">${kyomei?`凶に該当した真理：<b>${esc(badT.join('、'))}</b>`:'五大真理に凶はありません。'}
   ${dark?`<br>${tag('bad','ダークサイド効果')} 強い吉数（${kaku.rows.filter(r=>STRONG_NUMS.includes(r.k.n)).map(r=>r.n+r.v+'画').join('、')}）が、凶の真理により悪の方向へ増幅されます。`:''}</div>
  </div>`;
  h+=`</section>`;
  // 流年（九曜表：画数を9で割った系列。数え年がその系列の数と9年周期で重なる年の前後1年に象意が表面化する）
  const bd = parseBirth();
  const birth = bd? bd.y : 0;
  if(bd){
    const kg = kigaku(bd), dn = kigakuNow(kg.hon, kg.getsu, new Date(), new Date().getFullYear()-bd.y+1, kg.eff);
    const L=a=>a.length?a.join('・'):'なし';
    const card=(t,v,c)=>`<div class="card"><div class="hd"><span class="ttl">${t}</span>${tag(c||'good',v)}</div></div>`;
    h+=`<section class="panel"><h2>九星</h2>
      ${kg.near?`<p class="sub">節入りの前後1時間以内です（${fmtJST(kg.near)}頃）。万年暦で確認してください。</p>`:''}
      ${kg.edge?`<p class="sub">節入り当日（${fmtJST(kg.edge)}頃）です。出生時刻を入れると確定します（時刻未入力は12:00で判定）。</p>`:''}
      <div class="grid">
      ${card('本命星',STARS[kg.hon])}${card('月命星',STARS[kg.getsu])}
      ${kg.sw?card('月命星の切換（同会）',STARS[kg.sw],'warn'):''}${kg.needSex?card('月命星の切換（同会）','性別を選ぶと確定','warn'):''}
      ${kg.needSex?'':card('傾斜',STARS[HOMESTAR[kg.pos]])}${kg.needSex?'':card('同会',STARS[doukaiStar(kg.hon,kg.eff)])}
      ${kg.needSex?'':card('最大吉方',bestStars(kg.hon,kg.eff).map(x=>STARS[x]).join('・')||'なし')}
      ${card('年盤 最大吉方',L(dn.Y.best))}${card('年盤 吉方',L(dn.Y.good))}
      ${card('月盤 最大吉方（'+dn.month+'月）',L(dn.M.best))}${card('月盤 吉方（'+dn.month+'月）',L(dn.M.good))}
      ${card('年月ともに吉方',L(dn.both))}
      ${card('日盤 最大吉方（本日）',L(dn.D.best))}${card('日盤 吉方（本日）',L(dn.D.good))}
      ${dn.doyo?card('土用殺',STARS[HOMESTAR[dn.doyo.d]],'bad'):''}${dn.shouni?card('小児殺','月盤で適用（数え9歳以下）','warn'):''}
      </div></section>`;
  }
  if(birth>=1850 && birth<=2100){
    const age = new Date().getFullYear()-birth+1;       // 数え年（生まれた年が1歳）
    const lineK = kaku.rows.filter(r=>r.n!=='地数').map(r=>{
      const k=((r.v-1)%9)+1; const ages=[]; for(let a=k;a<=99;a+=9) ages.push(a);
      const now = ages.find(a=>Math.abs(a-age)<=1);
      const next = ages.find(a=>a>age+1);
      const kyoN = truths.some(t=>t.st==='bad');
      const eff = r.k.base.sho ? (kyoN? r.k.base.kyo : r.k.base.sho) : r.k.base.t;
      return `<div class="card"><div class="hd"><span class="ttl">${r.n}　${r.v}画（${k}の系列）</span>${tag(GCLS[r.k.g],GLAB[r.k.g])}</div>
        <p class="sub">回座年（数え）：${ages.map(a=>a===now?`<b>${a}</b>`:a).join('・')}歳</p>
        <p>${now?`${tag('warn','今がその時期')} 数え${age}歳は、${now}歳の前後1年にあたります。`:(next?`次の回座年は数え${next}歳（あと${next-1-age>0?next-1-age:0}年ほどで、前後1年に入ります）。`:'')}</p>
        ${now?`<p class="sub">${esc(r.k.base.l)}：${esc(eff)}</p>`:''}</div>`;
    }).join('');
    h+=`<section class="panel"><h2>流年（数え${age}歳）</h2><div class="grid">${lineK}</div></section>`;
  }
  box.innerHTML=verdictHtml+h; bind();
}
function bind(){
  document.querySelectorAll('[data-n]').forEach(el=>el.addEventListener('change',()=>{ STATE.ov.n[el.dataset.n]=el.value; render(); }));
  document.querySelectorAll('[data-sel]').forEach(el=>el.addEventListener('change',()=>{ STATE.ov.sel[el.dataset.sel]=Number(el.value); delete STATE.ov.n[el.dataset.sel]; render(); }));
  for(const k of ['tate','yoko','shibari']){ const el=document.getElementById('f-'+k); if(el) el.addEventListener('change',()=>{ STATE.flags[k]=el.checked; render(); }); }
  const y=document.getElementById('yomikudashi'); if(y) y.addEventListener('change',()=>{ STATE.yomikudashi=y.value; render(); });
}
/* 狭い画面では表を縦並びのカードにする：各セルに見出しを付ける */
function labelTables(root){
  root.querySelectorAll('table').forEach(t=>{
    const hs=[...t.querySelectorAll('thead th')].map(x=>x.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{ if(hs[i]) td.setAttribute('data-label',hs[i]); }));
  });
}
for(const id of ['result','qres','kres']){ const el=document.getElementById(id); if(el) new MutationObserver(()=>labelTables(el)).observe(el,{childList:true}); }
function syncHonmei(){ const b=parseBirth(); if(b) document.getElementById('honmei').value=STARS[kigaku(b).hon]; }
document.getElementById('go').addEventListener('click',()=>{ syncHonmei(); STATE.ov={n:{},sel:{}}; render(); });
for(const id of ['full','yomi','zoku','birth']) document.getElementById(id).addEventListener('keydown',e=>{ if(e.key==='Enter'){ syncHonmei(); STATE.ov={n:{},sel:{}}; render(); }});
for(const id of ['zoku','honmei','sex']) document.getElementById(id).addEventListener('change',render);
for(const id of ['birth','birthT']) document.getElementById(id).addEventListener('change',()=>{ const b=parseBirth(); if(b) document.getElementById('honmei').value=STARS[kigaku(b).hon]; render(); });

/* ================= 字典検索 ================= */
let qLimit=100;
function search(){
  const q = document.getElementById('q').value.trim();
  const qn = document.getElementById('qn').value;
  const qg = document.getElementById('qg').value;
  const qh = kata2hira(q);
  let res = DICT.filter(e=>{
    if(qn && e.n!==Number(qn)) return false;
    if(qg && e.g!==qg) return false;
    if(!q) return true;
    if([...q].some(ch=>/[㐀-鿿豈-﫿]/.test(ch))) return [...q].every(ch=>e.c===ch||e.k===ch) || e.c.includes(q) || e.k.includes(q);
    const toks = readingsOf(e);
    return toks.some(t=>t.includes(qh)) || kata2hira(e.y).includes(qh);
  });
  const total=res.length; res=res.slice(0,qLimit);
  document.getElementById('qinfo').textContent = `${total}件が見つかりました（全${DICT.length}件）。` + (total>qLimit?` 先頭の${qLimit}件を表示しています。`:'');
  document.getElementById('qres').innerHTML = `<table><thead><tr><th>字</th><th>鑑定字</th><th>鑑定数</th><th>五行</th><th>音訓</th><th>名乗り</th><th>辞典</th></tr></thead><tbody>`+
   res.map(e=>`<tr><td class="ch">${esc(e.c)}</td><td class="ch">${esc(e.k)}</td><td>${e.n}</td><td>${tag('none',e.g)}</td><td>${esc(e.y)}</td><td class="sub">${esc(e.a)}</td><td class="sub">p.${e.p}${e.f?' '+tag('warn','要確認'):''}</td></tr>`).join('')+`</tbody></table>`+
   (total>qLimit?`<p><button class="small" id="more">さらに100件表示</button></p>`:'');
  const m=document.getElementById('more'); if(m) m.addEventListener('click',()=>{ qLimit+=100; search(); });
}
for(const id of ['q','qn','qg']) document.getElementById(id).addEventListener('input',()=>{ qLimit=100; search(); });

/* ================= 画数の深義 ================= */
function kakuList(){
  const n=document.getElementById('kn').value, g=document.getElementById('kg').value;
  const rows=KAKUSU.filter(k=>(!n||k.n===Number(n))&&(!g||k.g===g));
  document.getElementById('kres').innerHTML=`<table><thead><tr><th>画数</th><th>総論</th><th>区分</th><th>人生の概観</th></tr></thead><tbody>`+
  rows.map(k=>`<tr><td><b>${k.n}</b></td><td>${esc(k.l)}</td><td>${tag(GCLS[k.g],GLAB[k.g])}<br><span class="sub">${k.ex?'本文':'判断'}</span></td><td>${esc(k.t)}${k.sho?`<br><span class="sub">正名：${esc(k.sho)}<br>凶名：${esc(k.kyo)}</span>`:''}</td></tr>`).join('')+`</tbody></table>`;
}
for(const id of ['kn','kg']) document.getElementById(id).addEventListener('input',kakuList);

/* ================= 設定 ================= */
/* ================= テーマ ================= */
function applyTheme(m){
  const r=document.documentElement;
  if(m==='light'||m==='dark') r.setAttribute('data-theme',m); else r.removeAttribute('data-theme');
  document.querySelectorAll('#theme button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
}
let THEME = LS.get('theme','auto');
applyTheme(THEME);
document.querySelectorAll('#theme button').forEach(b=>b.addEventListener('click',()=>{ THEME=b.dataset.m; LS.set('theme',THEME); applyTheme(THEME); }));

/* ================= タブ ================= */
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  for(const t of ['kantei','search','kaku']) document.getElementById('t-'+t).classList.toggle('hidden', t!==b.dataset.t);
  if(b.dataset.t==='search') search();
  if(b.dataset.t==='kaku') kakuList();
}));
</script>
